<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enable ruff UP (pyupgrade) rule and fix all 56 violations #3768</title>
<style>
/* ---------------------------------------------------------------- tokens */
/* Two typefaces, one accent, hairlines instead of panels. The diff keeps the
   conventional green and red because that convention is universal; nothing
   else on this page is coloured. */
:root {
  color-scheme: light dark;

  --text: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia,
          "Times New Roman", serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;

  --bg: #faf9f6;
  --panel: #fdfcfa;
  --panel-soft: #f2efe8;
  --line: #ddd7cb;
  --line-soft: #e9e4da;
  --ink: #1d1b18;
  --ink-soft: #54504a;
  --ink-faint: #837c70;
  --accent: #2a5c8f;
  --accent-fill: #eaf0f7;

  --add-bg: #e9f4ec;
  --add-ink: #1c6b3f;
  --add-gut: #cde5d5;
  --del-bg: #fbecec;
  --del-ink: #9c2f39;
  --del-gut: #f0cdd0;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14140f;
    --panel: #191914;
    --panel-soft: #201f1a;
    --line: #35332c;
    --line-soft: #2a2924;
    --ink: #eae7e0;
    --ink-soft: #aca69b;
    --ink-faint: #7e786d;
    --accent: #86b4e3;
    --accent-fill: #1a2430;

    --add-bg: #16241b;
    --add-ink: #85d3a4;
    --add-gut: #26432e;
    --del-bg: #261618;
    --del-ink: #e5919a;
    --del-gut: #4d262b;
  }
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.65 var(--text);
  font-variant-numeric: tabular-nums;
}
/* The scale is the hierarchy: masthead over chapter headline over layer
   heading over item title over body, and nothing between competes. */
h1, h2, h3, h4 { margin: 0; line-height: 1.25; letter-spacing: -.011em; }
h1 { font: 500 clamp(28px, 4.6vw, 36px)/1.2 var(--text); }
h2 { font: 500 clamp(25px, 4vw, 30px)/1.25 var(--text); }
h3 { font: 500 22px/1.3 var(--text); }
h4 { font: 600 15px/1.4 var(--text); }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: .06em; }
/* No box, no tint: a boxed code chip inside a serif sentence is a grey brick.
   The mono face alone says "this is a symbol". */
code { font: .88em/1.5 var(--mono); overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Two tracks in one column: the container is wide for what is scanned - code,
   diagrams, tables - and .prose caps what is read at a text measure. */
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 30px; }
.prose { max-width: 70ch; }
.quiet { color: var(--ink-soft); }
.faint { color: var(--ink-faint); }

/* -------------------------------------------------------------- masthead */
.masthead { border-bottom: 1px solid var(--line); padding: 52px 0 36px; }
.meta { font: 12.5px/1.7 var(--mono); color: var(--ink-faint); margin-bottom: 22px; }
.meta a { color: inherit; }
.headline { max-width: 27ch; text-wrap: balance; }
/* The story is the opening of the memo: three clauses a person would say out
   loud, set larger than the body and before anything else. */
.beats { margin-top: 26px; max-width: 70ch; }
.beat { font-size: 18px; line-height: 1.55; margin-top: 13px; }
.beat b { font-weight: 600; }
.caveat {
  margin-top: 18px; max-width: 66ch; color: var(--ink-soft);
  border-left: 2px solid var(--line); padding-left: 14px;
}
.triage { margin-top: 26px; color: var(--ink-soft); }
.answers { margin-top: 22px; }
.answers p + p { margin-top: 9px; }
.intent { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line-soft); max-width: 74ch; }
.intent p + p { margin-top: 10px; }
.intent b { font-weight: 600; }
/* Someone else's description, verbatim. `anywhere` because a URL in it has to
   shrink the block rather than widen the page. */
.rawdesc {
  font: 13px/1.65 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
  color: var(--ink-soft); border-left: 2px solid var(--line); padding-left: 14px;
  max-width: 84ch;
}
/* The reader's map of the rendered chapters: one plain line of anchors. */
.contents { margin-top: 30px; font: 12.5px/1.9 var(--mono); color: var(--ink-faint); }
.contents a { color: inherit; }

/* -------------------------------------------------------------- chapters */
/* A chapter boundary has to be unmistakable at a fast scroll: ninety pixels
   of air, a numbered mono kicker over a short hairline, then a headline one
   size below the masthead's. */
section.chap { padding: 90px 0 0; scroll-margin-top: 14px; }
.kicker {
  font: 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-faint);
}
.kicker::after {
  content: ""; display: block; width: 34px; margin-top: 12px;
  border-top: 1px solid var(--line);
}
.chaphead h2 { margin-top: 14px; }
.chap > .lead { margin-top: 10px; }
.lead { color: var(--ink-soft); max-width: 72ch; }
.counter { font: 12.5px/1.7 var(--mono); color: var(--ink-faint); margin-top: 10px; }

/* ------------------------------------------------------------ the pass bar */
/* Pinned, thin and quiet: the page's background, one hairline, no progress
   bar, no buttons. The script shows it only while a pass chapter is on
   screen; everywhere else the page stays bare. */
.passbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.passbar .wrap {
  font: 12.5px/1 var(--mono); color: var(--ink-faint);
  padding-top: 9px; padding-bottom: 9px;
}

/* ------------------------------------------------------------ disclosure */
/* The one load-bearing interaction. A summary row is a quiet text link, never
   a button: what is behind it is extra detail, never the only statement. */
details { margin-top: 16px; }
summary.link {
  cursor: pointer; list-style: none; display: flex; align-items: center; gap: 9px;
  color: var(--ink-soft); font-size: 14px; padding: 2px 0;
}
summary.link::-webkit-details-marker { display: none; }
summary.link::before {
  content: ""; width: 0; height: 0; border: 5px solid transparent;
  border-left-color: currentColor; flex: none; transition: transform .15s ease;
}
details[open] > summary.link::before { transform: rotate(90deg) translateX(-1px); }
summary.link:hover { color: var(--accent); }
summary.link .sub {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--ink-faint);
}

/* ---------------------------------------------------------- the layers */
/* The map chapter's subsections: a heading, the narrative, the contracts that
   changed here, the inventory one fold away. No panels. */
.layer { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--line-soft); }
.narrative { margin-top: 10px; }
.inventory > .inner { margin: 14px 0 0 20px; }
h4.block { margin: 30px 0 4px; }
h4.block + .sub { color: var(--ink-faint); font-size: 13.5px; }

/* --------------------------------------------------------------- steps */
/* The scroll margin keeps a jump target clear of the pinned pass bar. */
.step { margin-top: 32px; scroll-margin-top: 46px; }
.eyebrow {
  font: 11.5px/1.6 var(--mono); color: var(--ink-faint); margin-bottom: 3px;
  word-break: break-all;
}
.step > .head { display: flex; gap: 11px; align-items: flex-start; }
.tick { flex: none; width: 15px; height: 15px; margin: 6px 0 0; accent-color: var(--accent); }
.step h4 { font-size: 17px; min-width: 0; }
.step h4 .ord { font: 12.5px/1 var(--mono); color: var(--ink-faint); margin-right: 9px; }
/* The title is the fold's handle: a real button for the keyboard's sake, worn
   as plain text - no chevron, no chrome. */
.step h4 button {
  font: inherit; color: inherit; background: none; border: 0; padding: 0;
  text-align: left; cursor: pointer;
}
.step h4 button:hover { color: var(--accent); }
/* Ticked away: a folded item keeps its header line - eyebrow, number, title,
   tick - and nothing else. Screen only; paper always gets the whole step. */
@media screen {
  .step.folded .why, .step.folded .path, .step.folded .stepbody { display: none; }
}
/* The "why" and the line notes are the reason this page exists. They are set
   at reading size, never as captions. */
.why { margin-top: 7px; color: var(--ink-soft); max-width: 66ch; }
.path { font: 12px/1.6 var(--mono); color: var(--ink-faint); margin-top: 7px; word-break: break-all; }
.stepbody { margin: 12px 0 0 26px; }
.refs { font: 12.5px/1.7 var(--mono); color: var(--ink-faint); margin-top: 10px; word-break: break-word; }
.refs a { color: var(--accent); }

/* The project's own words, set apart from precis's, with the line they are
   written on so a reader can check them. */
.rule { border-left: 2px solid var(--line); padding-left: 14px; margin-bottom: 14px; }
.rule .said { max-width: 64ch; }
.rule .said + .said { margin-top: 8px; }
.rule .lbl { font-weight: 600; margin-right: 8px; }
.rule .src { font: 12px/1.6 var(--mono); color: var(--ink-faint); margin-top: 9px; }
/* The one place the report asks the reader for something. */
.q { border-left: 2px solid var(--accent); padding-left: 14px; max-width: 66ch; }

/* --------------------------------------------------------- skippable */
.skip > summary.link { align-items: flex-start; }
.skip > summary.link::before { margin-top: 8px; }
.skip .txt { min-width: 0; }
.skip .sub { display: inline; white-space: normal; overflow: visible; }
.skip .reason { display: block; color: var(--ink-soft); max-width: 76ch; margin-top: 3px; }
.skip .inner { margin: 12px 0 0 20px; }
.skip .samplelbl { color: var(--ink-faint); font-size: 14px; margin-bottom: 8px; }
.skip .filelist { font: 12px/1.9 var(--mono); color: var(--ink-soft); columns: 2; column-gap: 26px; }
.skip .filelist div { break-inside: avoid; word-break: break-all; }

/* ------------------------------------------------------------ contracts */
/* Before and after, never prose: a changed surface is a two-row table a reader
   checks in one glance. */
.contract { margin-top: 20px; scroll-margin-top: 14px; }
.cname { font: 600 14px/1.5 var(--mono); overflow-wrap: anywhere; }
.cnote { color: var(--ink-soft); max-width: 68ch; margin-top: 4px; }
table.beforeafter {
  border-collapse: collapse; width: 100%; margin-top: 10px;
  border: 1px solid var(--line);
}
table.beforeafter th {
  font: 600 12.5px/1.7 var(--text); color: var(--ink-faint); text-align: left;
  padding: 8px 14px; width: 74px; vertical-align: top;
}
table.beforeafter td { font: 12.5px/1.7 var(--mono); padding: 8px 14px 8px 0; overflow-wrap: anywhere; }
table.beforeafter tr + tr th, table.beforeafter tr + tr td { border-top: 1px solid var(--line-soft); }
table.beforeafter .none { font-family: var(--text); color: var(--ink-faint); }
.callers { margin-top: 10px; color: var(--ink-soft); max-width: 70ch; }
.callers b { color: var(--ink); font-weight: 600; }
.refl { font-family: var(--mono); font-size: .9em; overflow-wrap: anywhere; }

/* ---------------------------------------------------------- file ledger */
table.files { width: 100%; border-collapse: collapse; margin-top: 10px; }
table.files td { padding: 8px 0; border-top: 1px solid var(--line-soft); vertical-align: top; }
table.files .fp { font: 12.5px/1.6 var(--mono); overflow-wrap: anywhere; }
table.files .fp .dir { color: var(--ink-faint); }
table.files .moved { display: block; font-size: 11.5px; color: var(--ink-faint); }
table.files .word { color: var(--ink-faint); font-size: 13.5px; white-space: nowrap; padding-left: 18px; }
table.files .num { text-align: right; white-space: nowrap; font: 12px/1.6 var(--mono); padding-left: 18px; }
table.files .plus { color: var(--add-ink); }
table.files .minus { color: var(--del-ink); }
table.files .note { color: var(--ink-soft); font-size: 13.5px; margin-top: 3px; max-width: 62ch; }

/* --------------------------------------------------------------- hunks */
.hunk { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); margin-top: 12px; }
.hunk .hhead {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 6px 12px; background: var(--panel-soft); border-bottom: 1px solid var(--line-soft);
  font: 12px/1.6 var(--mono);
}
.hunk .hpath { font-weight: 600; word-break: break-all; }
.hunk .hpath .dir { color: var(--ink-faint); font-weight: 400; }
.hunk .hmeta { color: var(--ink-faint); }
.hunk .hsec { color: var(--ink-faint); flex: 1 1 auto; text-align: right; word-break: break-all; }
/* The one classification that shows: which of the four hats this hunk wears,
   because it changes what the reader does. One quiet word, no key needed. */
.tri { color: var(--ink-faint); white-space: nowrap; margin-left: auto; }
.tri.t-behaviour { color: var(--accent); }
.hbody { font: 12.5px/1.6 var(--mono); tab-size: 4; overflow-x: auto; }
.hline { display: flex; align-items: flex-start; }
.hline .gut {
  flex: none; display: flex; user-select: none; color: var(--ink-faint);
  font-size: 11px; padding-top: 1px;
}
.hline .gut span { display: inline-block; width: 3.3em; text-align: right; padding-right: .7em; }
.hline .sign { flex: none; width: 1.2em; text-align: center; color: var(--ink-faint); }
.hline .code {
  flex: 1 1 auto; min-width: 0; white-space: pre-wrap; overflow-wrap: break-word;
  padding: 0 12px 0 2.4ch; text-indent: -2.4ch;
}
.hline.add { background: var(--add-bg); }
.hline.add .sign { color: var(--add-ink); }
.hline.add .gut { background: var(--add-gut); }
.hline.del { background: var(--del-bg); }
.hline.del .sign { color: var(--del-ink); }
.hline.del .gut { background: var(--del-gut); }
.hline.ctx .gut { background: var(--panel-soft); }
/* precis talking, not the diff. The text face against the mono rows keeps the
   two voices apart without a colour or a badge. */
.hnote {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--panel); border-left: 2px solid var(--accent);
  border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
  padding: 10px 16px 10px 12px; font: 15px/1.6 var(--text); color: var(--ink);
}
.hnote .mk { color: var(--accent); flex: none; }
.hnote .txt { max-width: 68ch; }
/* The margin column an anchored note moves into on a wide screen. It only
   exists there: narrow screens and paper keep the inline notes above. */
.snipwrap { position: relative; }
.mnotes, .mconn { display: none; }
@media screen and (min-width: 1000px) {
  .snipwrap > .hunk { margin-right: 322px; }
  .snipwrap .hnote.inline { display: none; }
  /* The annotated line's marker: a 2px accent tick, not a highlight bar. */
  .snipwrap .hline.noted { box-shadow: inset 2px 0 0 var(--accent); }
  .mnotes { display: block; position: absolute; top: 0; right: 0; width: 300px; height: 100%; }
  .mnote { position: absolute; left: 0; width: 300px; font: 13.5px/1.55 var(--text); color: var(--ink); }
  .mconn { display: block; position: absolute; inset: 0; pointer-events: none; }
}
.trunc {
  padding: 7px 12px; font: 11.5px/1.6 var(--mono); color: var(--ink-faint);
  border-top: 1px solid var(--line-soft); background: var(--panel-soft);
}
.gapline {
  padding: 1px 12px; color: var(--ink-faint); font: 11px/1.6 var(--mono);
  background: var(--panel-soft); letter-spacing: .35em; text-align: center; user-select: none;
}

/* ------------------------------------------------------------- diagrams */
/* A picture earns its place only where it shows a delta. Two colours, two
   shapes, one scale across both sides, and a sentence underneath. */
figure { margin: 18px 0 0; }
.pair { display: grid; gap: 20px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.pair.stacked { grid-template-columns: minmax(0, 1fr); }
.side { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); overflow: hidden; }
.side h4 { padding: 9px 14px; border-bottom: 1px solid var(--line-soft); color: var(--ink-soft); }
.side .dbody { padding: 14px 12px; overflow-x: auto; }
.side svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
figcaption { margin-top: 14px; color: var(--ink-soft); max-width: 72ch; }
.dg-label { font-family: var(--text); font-size: 11.5px; }
.dg-lane { font-family: var(--text); font-size: 12px; font-weight: 600; }
.graph { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 18px 12px; overflow-x: auto; }
.graph svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
/* The call graph's default form: a trace copies into a pull request comment,
   an SVG does not. */
pre.trace {
  margin: 16px 0 0; padding: 14px 16px; overflow-x: auto;
  border: 1px solid var(--line); border-radius: 4px; background: var(--panel);
  font: 12.5px/1.75 var(--mono); white-space: pre;
}
pre.trace .tline { display: flex; gap: 18px; align-items: baseline; }
pre.trace .tmeta { margin-left: auto; color: var(--ink-faint); white-space: nowrap; }
pre.trace .mark { color: var(--accent); }
pre.trace .tnote {
  font: 14px/1.5 var(--text); color: var(--ink-soft); white-space: pre-wrap;
  max-width: 70ch; padding-bottom: 4px;
}
pre.trace code { font-size: 1em; }
.offgraph { margin-top: 16px; color: var(--ink-soft); max-width: 78ch; }
.offgraph b { color: var(--ink); font-weight: 600; }
.bdeltas { margin-top: 22px; }
.bdelta { margin-top: 12px; max-width: 70ch; }
.bdelta .mk { color: var(--accent); margin-right: 8px; }

/* --------------------------------------------------------------- seams */
.seam { margin-top: 20px; max-width: 72ch; }
.seam h4 { font-size: 16px; }
.seam p { color: var(--ink-soft); margin-top: 4px; }
.seam .meta { font: 12px/1.7 var(--mono); color: var(--ink-faint); margin-top: 6px; }

/* -------------------------------------------------------------- footer */
footer { margin-top: 64px; border-top: 1px solid var(--line); padding: 28px 0 48px; }
footer .cols { display: flex; flex-wrap: wrap; gap: 20px 44px; }
footer dt { font: 600 12px/1.6 var(--text); color: var(--ink-faint); }
footer dd { margin: 0; font: 12px/1.6 var(--mono); color: var(--ink-soft); word-break: break-all; }
footer .prov { margin-top: 22px; color: var(--ink-soft); max-width: 76ch; }
footer .prov + .prov { margin-top: 8px; }
footer ul { margin: 8px 0 0; padding-left: 20px; color: var(--ink-soft); }
footer li { margin-top: 3px; max-width: 74ch; }
footer .creed { margin-top: 24px; color: var(--ink-faint); max-width: 64ch; }

/* ---------------------------------------------------------- responsive */
@media (max-width: 860px) {
  .wrap { padding: 0 18px; }
  .pair { grid-template-columns: minmax(0, 1fr); }
  .skip .filelist { columns: 1; }
  .stepbody { margin-left: 0; }
}
@media (max-width: 720px) {
  /* A three-column ledger cannot survive a phone; stack each row instead. */
  table.files, table.files tbody, table.files tr, table.files td { display: block; }
  table.files tr { border-top: 1px solid var(--line-soft); padding: 8px 0; }
  table.files td { border: 0; padding: 1px 0; }
  table.files .word, table.files .num { text-align: left; padding-left: 0; display: inline-block; padding-right: 14px; }
}

/* --------------------------------------------------------------- print */
/* The memo test, literally: on paper this is a document. Every fold is open,
   every control is gone, every link is plain text. */
@media print {
  body { background: #fff; color: #000; font-size: 10.5pt; }
  .tick, .counter, .passbar { display: none !important; }
  summary.link { display: none; }
  details > *:not(summary) { display: revert; }
  a { color: inherit; text-decoration: none; }
  .stepbody { margin-left: 0; }
  section.chap { padding-top: 30px; }
  .hunk, .seam, .contract, .skip, .side { break-inside: avoid; }
  .layer { break-inside: auto; }
  .chaphead, .step > .head, .step .why { break-inside: avoid; break-after: avoid; }
  h2, h3, h4 { break-after: avoid; }
}
</style>
