   one changes what the reader does. Nothing on the page needs a key.
   ========================================================================= */

const M = JSON.parse(document.getElementById("precis-model").textContent);

/* ------------------------------------------------------------- vocabulary */
/* Words, not labels for marks. Each of these renders inside a sentence or as a
   quiet note beside a row; none of them is a legend entry. */
const SHAPE_LABEL = {
  feature: "Feature", bugfix: "Bug fix", refactor: "Refactor",
  docs: "Docs", chore: "Chore", mixed: "Mixed change"
};
const KIND_LABEL = {
  new_logic: "new logic", modified_logic: "modified logic", moved: "moved code",
  rename: "mechanical rename", formatting: "formatting only", generated: "generated",
  content: "values and content", deleted: "deleted"
};
/* Only the kinds that change how a row is read say anything. New and modified
   logic is what a file in a change is by default; saying so on every row would
   be a taxonomy again. */
const KIND_SHOWN = new Set(["moved", "rename", "formatting", "generated", "deleted"]);
const STATUS_LABEL = {
  added: "added", modified: "modified", deleted: "deleted", renamed: "renamed",
  copied: "copied", mode_changed: "mode changed", binary: "binary"
};
const SOURCE_KIND_LABEL = {
  github_pr: "GitHub pull request", gitlab_mr: "GitLab merge request",
  git_range: "git range", patch_file: "patch file"
};
const EVIDENCE_LABEL = {
  pr_description: "the description", linked_issue: "the linked issue",
  commit_messages: "the commit messages", branch_name: "the branch name",
  code: "the code"
};
const DELTA_LABEL = {
  scope_creep: "a separate concern", drive_by: "a drive-by change",
  incidental: "an incidental effect"
};
const REL_LABEL = {
  calls: "calls", returns: "returns", reads: "reads", writes: "writes",
  raises: "raises", imports: "imports", renders: "renders"
};
/* What the trace says about a node in words, so the reading survives a black
   and white printer. Unchanged says nothing: it is the default. */
const EMPH_LABEL = { added: "new", changed: "changed", removed: "removed", unchanged: "" };
const TRIAGE_LABEL = {
  behaviour: "behaviour", contract: "contract", mechanical: "mechanical",
  tests: "tests", docs: "docs"
};
const TESTS_TEXT = {
  yes: "Tests in this diff exercise the changed behaviour.",
  partial: "Tests in this diff exercise part of the changed behaviour.",
  none: "No test in this diff exercises the changed behaviour.",
  "n/a": "No changed runtime behaviour to exercise."
};

/* ----------------------------------------------------------------- utils */
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  add(n, kids);
  return n;
}
function add(parent, kids) {
  for (const kid of kids) {
    if (kid === null || kid === undefined || kid === false) continue;
    if (Array.isArray(kid)) { add(parent, kid); continue; }
    parent.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
}
const NS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids) {
  const n = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    /* SVG text cannot hold a <code> element, so a diagram label wearing the
       contract's backticks would print them as characters. The label is a
       symbol name either way; drop the markers and keep the name. */
    if (k === "text") { n.textContent = String(v).replace(/`/g, ""); continue; }
    n.setAttribute(k, v);
  }
  add(n, kids);
  return n;
}
function esc(str) {
  return String(str).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
/* Prose is plain text. A backtick span is the only markup the contract allows. */
function prose(text) {
  return h("span", { html: esc(text == null ? "" : text).replace(/`([^`]+)`/g, "<code>$1</code>") });
}
const plain = text => String(text == null ? "" : text).replace(/`/g, "");
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;
const basename = p => String(p).split("/").pop();
function splitPath(p) {
  const i = String(p).lastIndexOf("/");
  return i < 0 ? ["", p] : [p.slice(0, i + 1), p.slice(i + 1)];
}
/* "a, b and c": a list a reader hears as a sentence rather than a set. */
function listOf(items) {
  const list = items.filter(Boolean);
  if (list.length <= 1) return list.join("");
  return list.slice(0, -1).join(", ") + " and " + list[list.length - 1];
}
function textWidth(str, size) { return String(str).length * size * 0.56; }
function longestWord(str, size) {
  return String(str).split(/\s+/).reduce((a, w) => Math.max(a, textWidth(w, size)), 0);
}

/* ------------------------------------------------------- derived indexes */
const HUNKS = M.hunks || {};
const GROUPS = (M.change_map && M.change_map.groups) || [];
const FILES = [];
for (const g of GROUPS) {
  for (const f of g.files) FILES.push(Object.assign({ group: g }, f));
}
const FILE_BY_PATH = new Map(FILES.map(f => [f.path, f]));
const PASS = M.review_pass || {};
const STEPS = PASS.steps || [];
const CHECKS = PASS.checks || [];
const STEP_OF_HUNK = new Map();
for (const step of STEPS) {
  for (const id of step.hunk_ids) if (!STEP_OF_HUNK.has(id)) STEP_OF_HUNK.set(id, step.n);
}
/* The area that owns a path, which is how steps and checks find their way into
   the group that owns their file. */
function groupOfPath(path) {
  const f = path ? FILE_BY_PATH.get(path) : null;
  return f ? f.group : null;
}
const CONTRACTS = M.contracts || [];
const CONTRACT_HUNKS = new Set();
for (const c of CONTRACTS) for (const id of c.hunk_ids || []) CONTRACT_HUNKS.add(id);

/* Every hunk wears one of four hats, derived rather than declared so it cannot
   drift: tests and docs by the role of the area that owns the file, contract by
   appearing in a contracts entry, mechanical by significance, and what remains
   is the behaviour change itself. */
function triageOfHunk(hunk) {
  const f = FILE_BY_PATH.get(hunk.path);
  const role = f ? f.group.role : null;
  if (role === "tests") return "tests";
  if (role === "docs") return "docs";
  if (CONTRACT_HUNKS.has(hunk.id)) return "contract";
  if ((hunk.significance || (f && f.significance)) === "mechanical") return "mechanical";
  return "behaviour";
}

/* Where the behaviour change actually lives, counted from the hunks. This is
   the sentence a diff view cannot say: 1,400 lines, and the change is 4 hunks
   in 2 files. */
function behaviourFootprint() {
  const files = new Set();
  let hunks = 0;
  for (const id in HUNKS) {
    if (triageOfHunk(HUNKS[id]) !== "behaviour") continue;
    hunks++;
    files.add(HUNKS[id].path);
  }
  return { hunks, files: files.size };
}

/* Deep links: with a head SHA, a repo, and the PR's own URL to borrow a host
   from, every path:line in the report can point at the exact blob line. Without
   them it stays text. No host is ever hardcoded here; the page makes no
   requests and invents no destinations. */
function blobUrl(path, line) {
  const src = M.source || {};
  const sha = src.head && src.head.sha;
  if (!sha || !src.repo || !src.url) return null;
  if (src.kind !== "github_pr" && src.kind !== "gitlab_mr") return null;
  let origin;
  try { origin = new URL(src.url).origin; } catch (e) { return null; }
  const blob = src.kind === "gitlab_mr" ? "/-/blob/" : "/blob/";
  return origin + "/" + src.repo + blob + sha + "/" + path + "#L" + line;
}
function refLink(ref) {
  const i = String(ref).lastIndexOf(":");
  const url = i > 0 ? blobUrl(ref.slice(0, i), ref.slice(i + 1)) : null;
  return url
    ? h("a", { class: "refl", href: url, rel: "noreferrer", text: ref })
    : h("span", { class: "refl", text: ref });
}

/* A claim points at its code as text: the step that reads it when the pass
   covers it, the blob line when the source can be linked, its own name when
   neither is available. */
function refsLine(ids, label) {
  const list = (ids || []).filter(id => HUNKS[id]);
  if (!list.length) return null;
  const row = h("p", { class: "refs" }, (label || "Code") + ": ");
  list.forEach((id, i) => {
    const hunk = HUNKS[id];
    const line = hunk.new_start || hunk.old_start;
    const name = `${basename(hunk.path)}:${line}`;
    const step = STEP_OF_HUNK.get(id);
    const url = blobUrl(hunk.path, line);
    add(row, [i ? "  " : "",
      step ? h("a", { href: "#step-" + step, text: name, title: `Read in step ${step}` })
        : url ? h("a", { href: url, rel: "noreferrer", text: name })
          : h("span", { text: name })]);
  });
  return row;
}

/* ============================================================== masthead */
/* Five blocks, ten seconds: what this is, what it does, the story, the size of
   the reading, and the three answers a reviewer settles before opening a file.
   Confidence and evidence are provenance about the report rather than facts
   about the change, so they wait in the footer. */
function masthead(chapters) {
  const src = M.source || {};
  const story = M.story || {};

  const dot = () => h("span", { text: " · " });
  const meta = h("p", { class: "meta" },
    story.shape ? [h("span", { text: SHAPE_LABEL[story.shape] || story.shape })] : null,
    src.repo && [story.shape ? dot() : null, h("span", { text: src.repo })],
    src.identifier && [dot(), src.url
      ? h("a", { href: src.url, rel: "noreferrer", text: src.identifier })
      : h("span", { text: src.identifier })],
    src.author && [dot(), h("span", { text: "by " + src.author })]
  );

  return h("header", { class: "masthead", id: "top" },
    h("div", { class: "wrap" },
      meta,
      h("h1", { class: "headline" }, prose(story.headline || src.title || "")),
      (story.beats || []).length
        ? h("div", { class: "beats" }, story.beats.map(b => h("p", { class: "beat" },
            h("b", {}, prose(b.label), /[.!?:]$/.test(b.label || "") ? null : "."),
            " ", prose(b.text))))
        : null,
      story.caveat ? h("p", { class: "caveat" }, prose(story.caveat)) : null,
      triageSentence(),
      answers(),
      intentBlock(),
      contentsLine(chapters)
    )
  );
}

/* The reader's map: one plain line naming the chapters that actually rendered
   for this change, each an anchor. Absent chapters never appear, so the
   numbering the reader sees here is the numbering on the page. */
function contentsLine(chapters) {
  const row = h("p", { class: "contents" });
  chapters.forEach((c, i) => add(row, [i ? " · " : null,
    h("a", { href: "#" + c.id, text: c.n + " " + c.short })]));
  return row;
}

/* The number, the bar and the key were one sentence pretending to be a
   dashboard. This is the sentence. */
function triageSentence() {
  const stats = M.stats || {};
  const parts = [];
  parts.push(`${(stats.additions || 0).toLocaleString()} added and `
    + `${(stats.deletions || 0).toLocaleString()} removed across `
    + `${plural(stats.files_changed || 0, "file")}.`);

  const ratio = typeof stats.signal_ratio === "number" ? Math.round(stats.signal_ratio * 100) : null;
  if (ratio !== null) {
    const skipped = (PASS.skippable || []).map(g => plain(g.label).toLowerCase());
    parts.push(` ${ratio}% of the changed lines are the change itself`
      + (skipped.length ? `; the rest can be skimmed: ${skipped.join(", ")}.` : "."));
  }

  const footprint = behaviourFootprint();
  const minutes = PASS.estimated_minutes;
  const tail = minutes ? `, about ${plural(minutes, "minute")} to read.` : ".";
  if ((M.behavior || {}).changed && footprint.hunks) {
    parts.push(` The behaviour change is ${plural(footprint.hunks, "hunk")} in `
      + `${plural(footprint.files, "file")}${tail}`);
  } else if (STEPS.length) {
    parts.push(` ${plural(STEPS.length, "step")} to read${tail}`);
  }

  /* A partial reading is the one coverage fact that cannot wait for the
     footer, so it earns its line here and nowhere else. */
  const cov = M.coverage || {};
  if (cov.tier && cov.tier !== "full") {
    parts.push(` Only ${cov.hunks_read} of ${cov.hunks_total} hunks were read;`
      + " the footer says what was left.");
  }
  return h("p", { class: "triage prose", text: parts.join("") });
}

/* Three sentences, and a fourth when the diff carries more than one change.
   Each one either states the fact or links to where the page shows it. */
function answers() {
  const b = M.behavior || {};
  const story = M.story || {};
  const tests = story.tests || {};
  const seams = M.seams || {};
  const rows = [];

  rows.push(h("p", { class: "prose" }, b.changed
    ? [prose(b.summary || "Runtime behaviour changes."), " ",
       h("a", { href: "#behavior", text: "Before and after." })]
    : [h("span", { class: "quiet" }, prose(b.note || "No runtime behaviour changes."))]));

  rows.push(h("p", { class: "prose" }, CONTRACTS.length
    ? [`${CONTRACTS.length === 1 ? "One surface changes" : CONTRACTS.length + " surfaces change"} shape: `,
       CONTRACTS.map((c, i) => [i ? ", " : null,
         h("a", { href: "#contract-" + c.id }, h("code", { text: c.name }))]), "."]
    : [h("span", { class: "quiet",
        text: "Nothing someone outside this diff depends on changes shape." })]));

  const testText = TESTS_TEXT[tests.state];
  if (testText) {
    rows.push(h("p", { class: "prose" },
      h("span", { class: tests.state === "yes" || tests.state === "n/a" ? "quiet" : null },
        prose(testText)),
      tests.note ? [" ", h("span", { class: "quiet" }, prose(tests.note))] : null));
  }

  if (seams.detected) {
    rows.push(h("p", { class: "prose" },
      `This reads as ${plural((seams.clusters || []).length, "independent change")}. `,
      h("a", { href: "#seams", text: "Where the seams run." })));
  }
  return h("div", { class: "answers" }, rows);
}

/* What the change says it does, what else it does, and what it does not do.
   A short prose block, and only when there is something to reconcile. */
function intentBlock() {
  const story = M.story || {};
  const d = story.intent_delta || {};
  const also = d.also_does || [];
  const not = d.not_done || [];
  const src = M.source || {};
  if (!d.stated && !also.length && !not.length
      && !src.description && !(src.linked_issues || []).length) return null;

  const block = h("div", { class: "intent" });
  /* The author's words, quoted rather than re-rendered: backticks in someone
     else's description are their characters, not this report's markup. */
  if (d.stated) {
    block.append(h("p", {}, h("b", { text: "Says it does. " }), h("span", { text: d.stated })));
  }
  for (const a of also) {
    block.append(h("p", {},
      h("b", { text: "Also does. " }), prose(a.summary),
      a.kind && DELTA_LABEL[a.kind] ? h("span", { class: "quiet", text: ` This is ${DELTA_LABEL[a.kind]}.` }) : null));
    const where = (a.where || []).length
      ? h("p", { class: "refs" }, a.where.map((ref, i) => [i ? "  " : "", refLink(ref)]))
      : refsLine(a.hunk_ids);
    if (where) block.append(where);
  }
  for (const n of not) {
    block.append(h("p", {},
      h("b", { text: "Not in this diff. " }), prose(n.summary),
      n.note ? [" ", h("span", { class: "quiet" }, prose(n.note))] : null));
  }
  if (d.stated && !also.length && !not.length) {
    block.append(h("p", { class: "quiet",
      text: "The diff and the description account for each other." }));
  }
  if ((src.linked_issues || []).length) {
    block.append(h("p", { class: "quiet" }, "Linked: ",
      src.linked_issues.map((i, n) => [n ? ", " : null, i.url
        ? h("a", { href: i.url, rel: "noreferrer", text: `${i.id} ${i.title}` })
        : h("span", { text: `${i.id} ${i.title}` })])));
  }
  if (src.description) {
    block.append(h("details", {},
      h("summary", { class: "link", text: "The author's description, verbatim" }),
      h("div", { class: "rawdesc", text: src.description })));
  }
  return block;
}

/* =============================================================== chapters */
/* The page is numbered chapters built from one list. A chapter with nothing
   to say for this change is omitted, and the numbering closes over the gap,
   so neither the contents line nor the kickers ever count a hole. */
const CHAPTERS = [
  { id: "behavior", short: "Behaviour", title: "Behaviour: before and after", build: behaviorSection },
  { id: "map", short: "Structure", title: "What calls what", build: mapSection },
  { id: "layers", short: "Layer by layer", title: "The change, layer by layer", build: layersSection },
  { id: "reading", short: "The reading", title: "The reading", build: readingSection },
  { id: "decide", short: "Decide", title: "Decide", build: decideSection }
];

function buildChapters() {
  const chapters = [{ id: "top", short: "Overview", n: 1, node: null }];
  for (const def of CHAPTERS) {
    const node = def.build();
    if (!node) continue;
    const n = chapters.length + 1;
    node.prepend(chapterHead(n, def));
    chapters.push({ id: def.id, short: def.short, n, node });
  }
  return chapters;
}

function chapterHead(n, def) {
  return h("header", { class: "chaphead" },
    h("p", { class: "kicker", text: String(n).padStart(2, "0") + " · " + def.short }),
    h("h2", {}, prose(def.title)));
}

function section(id, lead, ...body) {
  return h("section", { class: "chap", id },
    lead ? h("p", { class: "lead" }, typeof lead === "string" ? prose(lead) : lead) : null,
    body);
}

/* ================================================================ the pass */
/* The ticks live in localStorage under the head SHA, so a reload resumes and a
   new head starts clean. Nothing else about a ticked step changes: it is a
   record of what was read, not a piece of choreography. */
const PASS_KEY = "precis-pass:" + (
  (M.source && M.source.head && M.source.head.sha) ||
  (M.source && M.source.identifier) || "unkeyed");

function loadTicks() {
  /* file:// denies storage in some browsers; the pass still works, it just
     forgets. */
  try { return new Set(JSON.parse(localStorage.getItem(PASS_KEY) || "[]")); }
  catch (e) { return new Set(); }
}
function saveTicks(set) {
  try { localStorage.setItem(PASS_KEY, JSON.stringify(Array.from(set))); } catch (e) { /* as above */ }
}

const TICKS = loadTicks();

function tickBox(key, label) {
  const box = h("input", { type: "checkbox", class: "tick", "aria-label": label,
    checked: TICKS.has(key) || null });
  box.addEventListener("change", () => {
    if (box.checked) TICKS.add(key); else TICKS.delete(key);
    saveTicks(TICKS);
    refreshCount();
  });
  return box;
}

function refreshCount() {
  const node = document.getElementById("count");
  if (!node) return;
  const total = STEPS.length + CHECKS.length;
  node.textContent = total ? `${TICKS.size} of ${total} done` : "";
}

/* ==================================================== chapter: the layers */
/* A prose-first map of the change: one subsection per layer, in the model's
   own order, which is the flow of a request through the system. Narrative
   first, the contracts that changed here under it, the inventory one quiet
   fold away. This chapter is a map, not a task list; the pass lives in the
   two chapters after it. */
function layersSection() {
  if (!GROUPS.length) return null;

  /* Wire each contract and skip group to the layer that owns its file.
     Anything no single layer owns closes the chapter instead. */
  const contractsOf = new Map(), skipsOf = new Map();
  const crossContracts = [], crossSkips = [];
  const claim = (map, gid, item) => {
    if (!map.has(gid)) map.set(gid, []);
    map.get(gid).push(item);
  };
  for (const c of CONTRACTS) {
    const g = groupOfPath(((HUNKS[(c.hunk_ids || [])[0]] || {}).path));
    if (g) claim(contractsOf, g.id, c);
    else crossContracts.push(c);
  }
  for (const sk of PASS.skippable || []) {
    let gid = (sk.group_ids || [])[0];
    if (!gid) {
      const owners = new Set((sk.files || [])
        .map(p => (groupOfPath(p) || {}).id).filter(Boolean));
      if (owners.size === 1) gid = owners.values().next().value;
    }
    if (gid && GROUPS.some(g => g.id === gid)) claim(skipsOf, gid, sk);
    else crossSkips.push(sk);
  }

  return section("layers", null,
    GROUPS.map(g => layerNode(g, contractsOf.get(g.id) || [],
                              skipsOf.get(g.id) || [])),
    crossContracts.length || crossSkips.length
      ? crossLayer(crossContracts, crossSkips) : null,
    seamsBlock());
}

function layerNode(g, contracts, skips) {
  const body = h("div", {});
  if (contracts.length) {
    body.append(h("h4", { class: "block",
      text: contracts.length === 1 ? "Changed contract" : "Changed contracts" }));
    body.append(h("p", { class: "sub",
      text: "a shape someone outside this diff depends on" }));
    for (const c of contracts) body.append(contractNode(c));
  }
  body.append(inventoryFold(g, skips));
  return h("section", { class: "layer", id: "layer-" + g.id },
    h("h3", {}, prose(g.label)),
    h("p", { class: "narrative prose" }, prose(g.narrative)),
    body);
}

/* Contracts and skip groups that no single layer owns close the chapter. */
function crossLayer(contracts, skips) {
  const body = h("div", {});
  if (contracts.length) {
    body.append(h("h4", { class: "block", text: "Changed contracts" }));
    for (const c of contracts) body.append(contractNode(c));
  }
  for (const sk of skips) body.append(skipRow(sk));
  return h("section", { class: "layer", id: "layer-cross" },
    h("h3", { text: "Across the change" }),
    body);
}

/* The complete account of a layer's files, one quiet fold away: the ledger,
   then the skip groups that live in this layer with their reasons. */
function inventoryFold(g, skips) {
  const adds = g.files.reduce((a, f) => a + (f.additions || 0), 0);
  const dels = g.files.reduce((a, f) => a + (f.deletions || 0), 0);
  return h("details", { class: "inventory" },
    h("summary", { class: "link", text:
      `${g.files.length === 1 ? "The one file" : "All " + g.files.length + " files"} in this layer`
      + ` · +${adds} −${dels}` }),
    h("div", { class: "inner" },
      filesTable(g),
      skips.map(skipRow)));
}

function filesTable(g) {
  return h("table", { class: "files" }, h("tbody", {},
    g.files.map(f => {
      const [dir, base] = splitPath(f.path);
      return h("tr", {},
        h("td", {},
          h("div", { class: "fp" }, h("span", { class: "dir", text: dir }), h("span", { text: base })),
          f.moved_from ? h("span", { class: "moved", text: "← " + f.moved_from }) : null,
          f.note ? h("div", { class: "note" }, prose(f.note)) : null),
        h("td", { class: "word",
          text: KIND_SHOWN.has(f.change_kind) ? KIND_LABEL[f.change_kind] : "" }),
        h("td", { class: "num" },
          f.additions ? h("span", { class: "plus", text: "+" + f.additions }) : null, " ",
          f.deletions ? h("span", { class: "minus", text: "−" + f.deletions }) : null,
          (!f.additions && !f.deletions)
            ? h("span", { class: "faint", text: STATUS_LABEL[f.status] }) : null)
      );
    })));
}

/* Independent concerns are part of the map, so they close the layer chapter:
   where the seams run, never advice to split. */
function seamsBlock() {
  const seams = M.seams || {};
  if (!seams.detected) return null;
  const clusters = seams.clusters || [];
  const nameOf = new Map(clusters.map(c => [c.id, c.label]));
  return h("section", { class: "layer", id: "seams" },
    h("h3", { text: "This reads as more than one change" }),
    seams.note ? h("p", { class: "narrative prose" }, prose(seams.note)) : null,
    clusters.map(c => h("div", { class: "seam" },
      h("h4", {}, prose(c.label)),
      h("p", {}, prose(c.summary)),
      h("p", { class: "meta",
        text: `${plural(c.file_count, "file")} · ${c.changed_lines.toLocaleString()} changed lines` }),
      (c.independent_of || []).length
        ? h("p", { class: "quiet", text: "Shares nothing with "
            + listOf(c.independent_of.map(id => plain(nameOf.get(id) || id))) + "." })
        : null)));
}

/* =================================================== chapter: the reading */
/* The guided pass, strictly linear: steps 1 to N in numeric order, one
   continuous flow. The by-layer view is the previous chapter's job; neither
   pretends to be the other. The tick counter lives here, where the pass
   starts. */
function readingSection() {
  if (!STEPS.length) return null;
  const minutes = PASS.estimated_minutes;
  const node = section("reading",
    `${plural(STEPS.length, "step")}, in the order the change makes sense`
    + `${minutes ? `, about ${plural(minutes, "minute")}` : ""}. `
    + "Tick as you go; the page remembers.",
    h("p", { class: "counter", id: "count" }),
    STEPS.map(stepItem));
  requestAnimationFrame(refreshCount);
  return node;
}

/* Without an area wrapper, each step names its own bearings: the layer it
   belongs to and the file it reads, one quiet line above the title. */
function stepEyebrow(step) {
  const path = step.path || ((HUNKS[step.hunk_ids[0]] || {}).path);
  const g = groupOfPath(path);
  const text = [g ? plain(g.label) : null, path ? basename(path) : null]
    .filter(Boolean).join(" · ");
  return text ? h("p", { class: "eyebrow", text }) : null;
}

function stepItem(step) {
  const anns = step.annotations || [];
  const body = h("div", { class: "stepbody" });
  /* The annotated lines carry the step; the full hunks sit one fold away. A
     page that reprints the whole diff is a page that loses to the diff. */
  for (const id of step.hunk_ids) {
    const hunk = HUNKS[id];
    if (!hunk) continue;
    const snip = snippetNode(hunk, anns.filter(a => a.hunk_id === id));
    if (snip) body.append(snip);
  }
  for (const a of anns.filter(a => a.new_line == null && a.old_line == null)) {
    body.append(noteNode(a));
  }
  const total = step.hunk_ids.reduce((n, id) => n + ((HUNKS[id] || {}).lines || []).length, 0);
  body.append(h("details", { class: "fulldiff" },
    h("summary", { class: "link",
      text: `The full diff: ${plural(total, "line")} in ${plural(step.hunk_ids.length, "hunk")}` }),
    step.hunk_ids.map(id => HUNKS[id] ? hunkNode(HUNKS[id]) : null)));

  return h("article", { class: "step", id: "step-" + step.n },
    h("div", { class: "head" },
      tickBox("s" + step.n, "Mark step " + step.n + " as read"),
      h("div", { style: "min-width:0" },
        stepEyebrow(step),
        h("h4", {}, h("span", { class: "ord", text: String(step.n) }), prose(step.title)),
        h("p", { class: "why" }, prose(step.why)))),
    body);
}

/* ======================================================= chapter: decide */
/* The questions only the reviewer can answer, numbered on from the steps so
   the whole pass stays one sequence. */
function decideSection() {
  if (!CHECKS.length) return null;
  return section("decide", "Yours to judge; precis has no opinion.",
    CHECKS.map((check, i) => checkItem(check, STEPS.length + i + 1)));
}

/* A rule is quoted, never paraphrased and never re-rendered: `text` rather than
   `prose`, because the backticks in someone else's document are their
   characters and not this report's markup. The attribution is the point of the
   block, so it is never optional. */
function ruleQuote(rule) {
  if (!rule) return null;
  const said = (label, value) => value
    ? h("p", { class: "said" }, label ? h("span", { class: "lbl", text: label }) : null,
        h("span", { text: value }))
    : null;
  return h("div", { class: "rule" },
    said(rule.was ? "Was" : null, rule.was),
    said(rule.was ? "Now" : null, rule.quote),
    h("p", { class: "src" }, refLink(rule.source)));
}

function checkItem(check, n) {
  return h("article", { class: "step", id: "check-" + n },
    h("div", { class: "head" },
      tickBox("c" + n, "Mark check " + n + " as decided"),
      h("div", { style: "min-width:0" },
        h("h4", {}, h("span", { class: "ord", text: String(n) }), prose(check.title)),
        h("p", { class: "why" }, prose(check.why)),
        check.path ? h("p", { class: "path", text: check.path }) : null)),
    h("div", { class: "stepbody" },
      ruleQuote(check.rule),
      h("p", { class: "q" }, prose(check.question)),
      refsLine(check.hunk_ids)));
}

/* One changed contract: what the surface looked like, what it looks like now,
   and what happened to its callers. A delta a reader can check in one glance,
   never a paragraph describing one. */
function contractNode(c) {
  const side = (cls, label, value) => h("tr", { class: cls },
    h("th", { text: label }),
    h("td", {}, value == null
      ? h("span", { class: "none", text: cls === "b" ? "did not exist" : "removed" })
      : h("span", { text: value })));
  return h("div", { class: "contract", id: "contract-" + c.id },
    h("p", { class: "cname", text: c.name }),
    c.note ? h("p", { class: "cnote" }, prose(c.note)) : null,
    h("table", { class: "beforeafter" }, h("tbody", {},
      side("b", "Before", c.before),
      side("a", "After", c.after))),
    callersLine(c.callers),
    refsLine(c.hunk_ids));
}

/* The blast radius, derived from its parts so the total cannot disagree with
   them. An untouched call site is the reader's lead, so it gets the ref. */
function callersLine(callers) {
  if (!callers) return null;
  const untouched = callers.untouched || [];
  const total = (callers.updated || 0) + untouched.length;
  if (!total) {
    return h("p", { class: "callers quiet", text: "No call sites elsewhere in the repository." });
  }
  const bits = [h("b", { text: plural(total, "call site") }), " elsewhere in the repository: "];
  if (!untouched.length) {
    bits.push(`all ${callers.updated === 1 ? "" : String(callers.updated) + " "}updated in this diff.`);
  } else {
    bits.push(`${callers.updated} updated in this diff, ${untouched.length} not touched: `);
    untouched.forEach((ref, i) => bits.push(i ? " · " : "", refLink(ref)));
  }
  return h("p", { class: "callers" }, bits);
}

/* One skippable group: the label, the reason it can be left, and every file it
   covers, so nothing is hidden. */
function skipRow(g) {
  const sample = g.sample_hunk_id ? HUNKS[g.sample_hunk_id] : null;
  /* The label, the count and the reason all live in the summary: what can be
     skipped and why is a statement the page makes without being opened. */
  return h("details", { class: "skip" },
    h("summary", { class: "link" },
      h("span", { class: "txt" },
        h("span", {}, prose(g.label)),
        h("span", { class: "sub",
          text: `  ${plural(g.file_count, "file")} · +${g.additions} −${g.deletions} · skim or skip` }),
        h("span", { class: "reason" }, prose(g.reason)))),
    h("div", { class: "inner" },
      sample ? h("div", {},
        h("p", { class: "samplelbl",
          text: "One representative hunk; the rest follow the same shape." }),
        hunkNode(sample)) : null,
      h("div", { class: "filelist" }, (g.files || []).map(p => h("div", { text: p })))));
}

/* --------------------------------------------------------------- hunks */
/* The full diff of one hunk, plain. Annotations belong to the snippets; a
   full hunk behind its fold is only ever the code itself. */
function hunkNode(hunk) {
  const body = h("div", { class: "hbody" });
  const lines = hunk.lines || [];
  /* A file that is entirely new has no old-side numbers; do not spend a column
     on an empty gutter, especially on a phone. */
  const hasOld = lines.some(l => l.old != null);
  const hasNew = lines.some(l => l.new != null);
  for (const line of lines) body.append(lineNode(line, hasOld, hasNew));
  if (hunk.truncated) {
    body.append(h("div", { class: "trunc",
      text: `Truncated: showing the first ${plural(lines.length, "line")} of this hunk.` }));
  }
  return h("div", { class: "hunk", id: "hunk-" + hunk.id }, hunkHead(hunk, true), body);
}

function hunkHead(hunk, full) {
  const [dir, base] = splitPath(hunk.path);
  const triage = triageOfHunk(hunk);
  return h("div", { class: "hhead" },
    h("span", { class: "hpath" }, h("span", { class: "dir", text: dir }), base),
    hunk.old_path ? h("span", { class: "hmeta", text: "← " + hunk.old_path }) : null,
    full ? h("span", { class: "hmeta", text: hunk.header
      || `@@ -${hunk.old_start},${hunk.old_lines} +${hunk.new_start},${hunk.new_lines} @@` }) : null,
    hunk.section ? h("span", { class: "hsec", text: hunk.section }) : null,
    h("span", { class: "tri t-" + triage, text: TRIAGE_LABEL[triage] }));
}

function lineNode(line, hasOld, hasNew) {
  const cls = line.t === "+" ? "add" : line.t === "-" ? "del" : "ctx";
  /* A CRLF file keeps its carriage returns in the model so the analysis can see
     a line-ending change. Under `white-space: pre-wrap` a lone CR is a line
     break, so it would print every such line with a blank one under it. */
  const text = line.c.endsWith("\r") ? line.c.slice(0, -1) : line.c;
  return h("div", { class: "hline " + cls },
    h("span", { class: "gut" },
      hasOld ? h("span", { text: line.old == null ? "" : line.old }) : null,
      hasNew ? h("span", { text: line.new == null ? "" : line.new }) : null),
    h("span", { class: "sign", text: line.t === " " ? "" : line.t }),
    h("span", { class: "code", text: text }));
}

/* An annotation is the highest-value text on the page: precis pointing at one
   line and saying what it does. `inline` marks the copy that lives between
   code rows, which the wide layout swaps for its margin twin. */
function noteNode(a, inline) {
  return h("div", { class: "hnote" + (inline ? " inline" : "") },
    h("span", { class: "mk", text: "›" }),
    h("div", { class: "txt" }, prose(a.text)));
}

/* The annotated lines of one hunk, each with a line of context either side.
   This is what a step shows by default: the lines precis wrote about, not the
   wall of diff around them. Every anchored note is laid down twice - inline in
   the code flow, and as a margin twin the wide layout positions beside its
   line - and CSS shows exactly one of the two, so print and phones need no
   script. Returns null when nothing in the hunk is anchored, and the caller
   falls back to the fold. */
function snippetNode(hunk, annotations) {
  const lines = hunk.lines || [];
  const anchored = [];
  for (const a of annotations || []) {
    let idx = -1;
    if (a.new_line != null) idx = lines.findIndex(l => l.new === a.new_line);
    else if (a.old_line != null) idx = lines.findIndex(l => l.old === a.old_line);
    if (idx >= 0) anchored.push({ a, idx });
  }
  if (!anchored.length) return null;

  const CTX = 1;
  const keep = new Set();
  for (const { idx } of anchored) {
    for (let i = Math.max(0, idx - CTX); i <= Math.min(lines.length - 1, idx + CTX); i++) keep.add(i);
  }
  const notesAt = new Map();
  for (const { a, idx } of anchored) {
    if (!notesAt.has(idx)) notesAt.set(idx, []);
    notesAt.get(idx).push(a);
  }

  const body = h("div", { class: "hbody" });
  const hasOld = lines.some(l => l.old != null);
  const hasNew = lines.some(l => l.new != null);
  const pairs = [];
  let prev = -2;
  for (const i of Array.from(keep).sort((a, b) => a - b)) {
    if (i > prev + 1) body.append(h("div", { class: "gapline", text: "· · ·" }));
    const row = lineNode(lines[i], hasOld, hasNew);
    const notes = notesAt.get(i) || [];
    if (notes.length) row.className += " noted";
    body.append(row);
    for (const a of notes) {
      body.append(noteNode(a, true));
      pairs.push({ line: row, note: h("div", { class: "mnote" }, prose(a.text)) });
    }
    prev = i;
  }
  const wrap = h("div", { class: "snipwrap" },
    h("div", { class: "hunk snippet" }, hunkHead(hunk, false), body),
    h("div", { class: "mnotes" }, pairs.map(p => p.note)));
  wrap._pairs = pairs;
  SNIPWRAPS.push(wrap);
  return wrap;
}

/* ----------------------------------------------------------- margin notes */
/* The wide layout moves each anchored note into the margin beside its line:
   top-aligned with the line, pushed down when the note above needs the room,
   and tied back by a hairline connector so a pushed note still names its
   line. Everything here is geometry; the words were laid down at build time,
   so a browser without any of this still shows the inline notes. */
const SNIPWRAPS = [];
const WIDE = matchMedia("(min-width: 1000px)");

function placeMarginNotes(wrap) {
  const pairs = wrap._pairs || [];
  if (!pairs.length) return;
  if (!WIDE.matches) {
    wrap.style.minHeight = "";
    if (wrap._conn) wrap._conn.replaceChildren();
    return;
  }
  const box = wrap.getBoundingClientRect();
  if (!box.height) return;                     /* inside a closed fold */
  if (!wrap._conn) {
    wrap._conn = s("svg", { class: "mconn", "aria-hidden": "true" });
    wrap.append(wrap._conn);
  }
  const code = wrap.firstChild.getBoundingClientRect();
  const x1 = code.right - box.left + 2;
  const x2 = box.width - 308;
  let flow = 0;
  const ties = [];
  for (const p of pairs) {
    const lr = p.line.getBoundingClientRect();
    const lineTop = lr.top - box.top;
    const top = Math.max(lineTop, flow);
    p.note.style.top = top + "px";
    flow = top + p.note.offsetHeight + 12;
    ties.push({ y1: lineTop + lr.height / 2, y2: top + 9 });
  }
  wrap.style.minHeight = Math.ceil(flow - 12) + "px";
  const w = Math.ceil(box.width), hh = Math.ceil(Math.max(box.height, flow));
  wrap._conn.setAttribute("viewBox", `0 0 ${w} ${hh}`);
  wrap._conn.setAttribute("width", w);
  wrap._conn.setAttribute("height", hh);
  wrap._conn.replaceChildren(...ties.map(t => s("line", {
    x1, y1: t.y1, x2, y2: t.y2, stroke: "var(--line)", "stroke-width": 1 })));
}

function placeAllMarginNotes() {
  for (const wrap of SNIPWRAPS) placeMarginNotes(wrap);
}

/* ------------------------------------------------------------ call graph */
/* Which symbol calls which, including the neighbours that did not change. It
   renders as an indented trace by default: more legible than a picture, and it
   pastes into a pull request comment. Only a graph that genuinely branches
   earns the drawing. */
function mapSection() {
  const cm = M.change_map || {};
  const graph = cm.graph;
  /* No structure changed means no diagram at all. A map of unchanged code is
     decoration, and decoration is what this page exists to not be. */
  if (!graph || !(graph.nodes || []).length) return null;

  const body = graphBranches(graph)
    ? h("div", { class: "graph" }, drawCallGraph(graph).node)
    : callTrace(graph);
  return section("map", cm.summary || null, body, offGraphNote(graph));
}

/* A linear trace cannot misrepresent a chain. It can misrepresent a fan, so a
   node with two or more changed parents or children gets drawn instead. */
function graphBranches(graph) {
  const emph = new Map((graph.nodes || []).map(n => [n.id, n.emphasis]));
  const inc = new Map(), out = new Map();
  const bump = (m, k) => m.set(k, (m.get(k) || 0) + 1);
  for (const e of graph.edges || []) {
    if (!emph.has(e.from) || !emph.has(e.to)) continue;
    const moved = e.emphasis !== "unchanged";
    /* What counts is whether the neighbour on the other end is part of the
       change: two untouched callers of a changed function are still a line. */
    if (moved || emph.get(e.to) !== "unchanged") bump(out, e.from);
    if (moved || emph.get(e.from) !== "unchanged") bump(inc, e.to);
  }
  for (const n of graph.nodes || []) {
    if ((out.get(n.id) || 0) >= 2 || (inc.get(n.id) || 0) >= 2) return true;
  }
  return false;
}

/* What this node's own hunks add and remove, as "+7 -2", or "" for a node the
   change did not touch. Counts belong to the node, not to the file it happens
   to sit in: an unchanged neighbour must not wear its file's stats. */
function nodeCounts(node) {
  let added = 0, removed = 0;
  for (const id of node.hunk_ids || []) {
    for (const line of (HUNKS[id] || {}).lines || []) {
      if (line.t === "+") added++;
      else if (line.t === "-") removed++;
    }
  }
  const counts = [];
  if (added) counts.push("+" + added);
  if (removed) counts.push("−" + removed);
  return counts.join(" ");
}

/* Depth-first from the entry points, following the edges. Anything the walk
   never reaches is listed after it rather than dropped. */
function traceRows(graph) {
  const nodes = graph.nodes || [];
  const byId = new Map(nodes.map(n => [n.id, n]));
  const edges = (graph.edges || []).filter(e => byId.has(e.from) && byId.has(e.to));
  const outs = new Map(nodes.map(n => [n.id, []]));
  const indeg = new Map(nodes.map(n => [n.id, 0]));
  for (const e of edges) {
    outs.get(e.from).push(e);
    indeg.set(e.to, indeg.get(e.to) + 1);
  }
  const rows = [], seen = new Set();
  const walk = (id, depth, edge) => {
    if (seen.has(id)) return;
    seen.add(id);
    rows.push({ node: byId.get(id), depth, edge });
    for (const e of outs.get(id)) walk(e.to, depth + 1, e);
  };
  for (const n of nodes) if (indeg.get(n.id) === 0) walk(n.id, 0, null);
  for (const n of nodes) walk(n.id, 0, null);
  return rows;
}

function callTrace(graph) {
  const pre = h("pre", { class: "trace" });
  for (const row of traceRows(graph)) {
    const node = row.node;
    const pad = "  ".repeat(row.depth);
    const rel = row.edge ? (REL_LABEL[row.edge.kind] || row.edge.kind) : null;
    const lead = row.edge ? (rel === "calls" ? "→ " : rel + " ") : "";
    const word = EMPH_LABEL[node.emphasis] || "";
    const meta = [node.path ? basename(node.path) : null, nodeCounts(node),
                  row.edge && row.edge.label ? row.edge.label : null]
      .filter(Boolean).join("  ");
    pre.append(h("div", { class: "tline" },
      h("span", { class: node.emphasis === "unchanged" ? null : "mark",
        text: pad + lead + plain(node.label) }),
      (meta || word) ? h("span", { class: "tmeta" },
        meta, word ? (meta ? "  " : "") + "← " + word : "") : null));
    if (node.note) {
      pre.append(h("div", { class: "tnote" }, pad + "    ", prose(node.note)));
    }
  }
  return pre;
}

function drawCallGraph(graph) {
  const drawn = drawFlow({ kind: "flow", nodes: graph.nodes, edges: graph.edges }, {
    /* `calls` is the default reading of an arrow, so labelling it adds noise.
       Everything else earns its word. */
    edgeLabel: e => e.label || (e.kind === "calls" ? null : REL_LABEL[e.kind] || e.kind),
    sub: node => {
      if (!node.path) return null;
      const counts = nodeCounts(node);
      return basename(node.path) + (counts ? "  " + counts : "");
    }
  });
  /* Past about four fifths scale the symbol names stop being readable, and an
     unreadable graph is worse than one you have to push sideways. */
  drawn.node.style.minWidth = Math.round(drawn.naturalWidth * 0.8) + "px";
  return drawn;
}

/* Files the graph does not reach get named and counted here rather than in the
   model, so the number cannot drift out of step with the nodes drawn. */
function offGraphNote(graph) {
  const on = new Set((graph.nodes || []).map(n => n.path).filter(Boolean));
  const by = new Map();
  for (const f of FILES) {
    if (on.has(f.path)) continue;
    by.set(f.group.label, (by.get(f.group.label) || 0) + 1);
  }
  const total = Array.from(by.values()).reduce((a, b) => a + b, 0);
  if (!total) return null;
  const parts = Array.from(by.entries()).sort((a, b) => b[1] - a[1])
    .map(([label, n]) => `${plain(label)} (${n})`);
  return h("p", { class: "offgraph" },
    h("b", { text: plural(total, "file") }),
    total === 1 ? " ripples from this and appears on no path: "
                : " ripple from this and appear on no path: ",
    h("span", { class: "faint", text: listOf(parts) }));
}

/* ------------------------------------------------------------- behaviour */
function behaviorSection() {
  const b = M.behavior || {};
  /* Unchanged behaviour is answered in the masthead in one line; a section
     repeating it would be a diagram-shaped hole. */
  if (!b.changed) return null;

  const pair = h("div", { class: "pair" });
  const sides = [];
  for (const side of ["before", "after"]) {
    const d = b[side];
    if (!d) continue;
    const body = h("div", { class: "dbody" });
    pair.append(h("div", { class: "side" },
      h("h4", {}, prose(d.title || (side === "before" ? "Before" : "After"))), body));
    sides.push({ d, body });
  }
  const drawAll = () => {
    const wide = pair.clientWidth || 900;
    let natural = 0;
    const built = sides.map(c => {
      const svg = c.d.kind === "sequence" ? drawSequence(c.d) : drawFlow(c.d);
      natural = Math.max(natural, svg.naturalWidth);
      return { c, svg };
    });
    const perColumn = (wide - 20) / 2 - 26;
    pair.classList.toggle("stacked", natural > perColumn * 1.45 || wide < 760);
    /* Both sides render at one scale: a before and after pair read at different
       zoom levels is a comparison the eye has to undo. */
    for (const { c, svg } of built) {
      svg.node.removeAttribute("width");
      svg.node.removeAttribute("height");
      svg.node.style.width = (svg.naturalWidth / natural * 100) + "%";
      svg.node.style.maxWidth = svg.naturalWidth + "px";
      c.body.replaceChildren(svg.node);
    }
  };
  requestAnimationFrame(drawAll);
  window.addEventListener("resize", debounce(drawAll, 150));

  const figure = h("figure", {}, pair,
    b.summary ? h("figcaption", {}, "What changed: ", prose(b.summary)) : null);

  const deltas = (b.deltas || []).length ? h("div", { class: "bdeltas" },
    b.deltas.map(d => h("div", { class: "bdelta" },
      h("span", { class: "mk", text: "▸" }), prose(d.summary),
      refsLine(d.hunk_ids)))) : null;

  return section("behavior", null, figure, deltas);
}

function debounce(fn, ms) {
  let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); };
}

/* Two colours inside a diagram and no more: ink for what was already there,
   the accent for what this change added or altered, a dashed ink outline for
   what it removed. */
function emphColor(e) {
  return (e === "added" || e === "changed") ? "var(--accent)" : "var(--ink-soft)";
}
function emphWidth(e) { return e === "unchanged" ? 1.2 : 1.8; }
/* Dashes mean removed, and only removed. An async hop is dotted, which reads as
   a different statement rather than a competing one. */
function edgeDash(edge) {
  if (edge.emphasis === "removed") return "5 4";
  if (edge.kind === "async") return "1.5 3.5";
  return null;
}

/* Rectangles and diamonds. A shape vocabulary is the same disease as a colour
   vocabulary: it asks the reader to learn a key before the picture says
   anything. */
function nodeShape(kind, g, fill, stroke, emphasis) {
  const dash = emphasis === "removed" ? "5 4" : null;
  const attrs = { fill, stroke, "stroke-width": emphWidth(emphasis), "stroke-dasharray": dash };
  const { x, y, w, h: hh } = g;
  if (kind === "decision") {
    /* A true diamond around a wide label would be mostly empty air; the ends
       slant at 45 degrees instead, which reads the same and stays compact. */
    const c = Math.min(w / 2, hh * 0.9);
    return s("path", Object.assign({
      d: `M ${x + c} ${y} H ${x + w - c} L ${x + w} ${y + hh / 2} L ${x + w - c} ${y + hh} `
       + `H ${x + c} L ${x} ${y + hh / 2} Z`
    }, attrs));
  }
  return s("rect", Object.assign({ x, y, width: w, height: hh, rx: 4 }, attrs));
}

/* ---------------------------------------------------------- flow diagram */
/* Shared by the behaviour diagrams and the call graph. Node boxes are sized to
   their labels rather than the other way round: a label clipped to
   unreadability is a diagram that lied about its own contents. */
function drawFlow(d, opts) {
  opts = opts || {};
  const GAPX = 26, GAPY = 48, PAD = 16;
  const nodes = (d.nodes || []).map((n, i) => Object.assign({}, n, { i }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const edges = (d.edges || []).filter(e => byId.has(e.from) && byId.has(e.to));
  const subOf = opts.sub || (() => null);
  const subs = new Map(nodes.map(n => [n.id, subOf(n)]));

  /* One width for every box, wide enough that the longest word fits and most
     labels land in two lines. */
  let NW = 176;
  for (const n of nodes) {
    const label = String(n.label || "");
    const sub = subs.get(n.id);
    NW = Math.max(NW,
      Math.min(300, longestWord(label, 11.5) + 26),
      Math.min(300, textWidth(label, 11.5) / 2 + 26),
      sub ? Math.min(300, textWidth(sub, 9.5) + 22) : 0);
  }
  NW = Math.round(NW);

  /* Break cycles so ranking terminates; a retry loop is a back edge, not a layer. */
  const adj = new Map(nodes.map(n => [n.id, []]));
  edges.forEach((e, i) => adj.get(e.from).push({ to: e.to, i }));
  const state = new Map(), back = new Set();
  const walk = id => {
    state.set(id, 1);
    for (const { to, i } of adj.get(id)) {
      const st = state.get(to) || 0;
      if (st === 1) back.add(i);
      else if (st === 0) walk(to);
    }
    state.set(id, 2);
  };
  for (const n of nodes) if (!state.get(n.id)) walk(n.id);
  const fwd = edges.map((e, i) => ({ e, i })).filter(x => !back.has(x.i)).map(x => x.e);

  const rank = new Map(nodes.map(n => [n.id, 0]));
  const indeg = new Map(nodes.map(n => [n.id, 0]));
  const outs = new Map(nodes.map(n => [n.id, []]));
  for (const e of fwd) { indeg.set(e.to, indeg.get(e.to) + 1); outs.get(e.from).push(e.to); }
  const queue = nodes.filter(n => indeg.get(n.id) === 0).map(n => n.id);
  while (queue.length) {
    const id = queue.shift();
    for (const to of outs.get(id)) {
      if (rank.get(to) < rank.get(id) + 1) rank.set(to, rank.get(id) + 1);
      indeg.set(to, indeg.get(to) - 1);
      if (indeg.get(to) === 0) queue.push(to);
    }
  }
  const maxRank = Math.max(0, ...nodes.map(n => rank.get(n.id)));
  const rows = [];
  for (let r = 0; r <= maxRank; r++) rows.push(nodes.filter(n => rank.get(n.id) === r));

  /* Two barycentre sweeps: enough to untangle diagrams this small. */
  const pos = new Map();
  rows.forEach(row => row.forEach((n, i) => pos.set(n.id, i)));
  const preds = new Map(nodes.map(n => [n.id, []]));
  const succs = new Map(nodes.map(n => [n.id, []]));
  for (const e of fwd) { preds.get(e.to).push(e.from); succs.get(e.from).push(e.to); }
  const bary = (n, rel) => {
    const ns = rel.get(n.id);
    if (!ns.length) return pos.get(n.id);
    return ns.reduce((a, id) => a + (pos.get(id) || 0), 0) / ns.length;
  };
  const sweep = dir => {
    const order = dir > 0 ? rows.slice(1) : rows.slice(0, -1).reverse();
    for (const row of order) {
      const rel = dir > 0 ? preds : succs;
      row.sort((a, b) => bary(a, rel) - bary(b, rel));
      row.forEach((n, i) => pos.set(n.id, i));
    }
  };
  sweep(1); sweep(-1); sweep(1);

  /* Geometry. */
  const wrapped = new Map(nodes.map(n =>
    [n.id, wrapText(n.label, NW - 22, 11.5, subs.get(n.id) ? 3 : 4)]));
  const nodeH = n => 30 + (wrapped.get(n.id).length - 1) * 14 + (subs.get(n.id) ? 14 : 0);
  const rowW = row => row.length * NW + (row.length - 1) * GAPX;
  const widest = Math.max(...rows.map(rowW));
  const RIGHT = back.size ? 34 : 0;
  const W = Math.round(PAD * 2 + widest + RIGHT);

  let y = PAD;
  const geom = new Map();
  for (const row of rows) {
    const rh = Math.max(...row.map(nodeH));
    let x = PAD + (widest - rowW(row)) / 2;
    for (const n of row) {
      geom.set(n.id, { x, y, w: NW, h: nodeH(n), cx: x + NW / 2, cy: y + nodeH(n) / 2 });
      x += NW + GAPX;
    }
    y += rh + GAPY;
  }
  const H = Math.round(y - GAPY + PAD);

  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H,
    role: "img", "aria-label": (d.title || "flow") + " diagram" });

  const labelOf = opts.edgeLabel || (e => e.label);
  edges.forEach((edge, i) => {
    const label = labelOf(edge);
    const e = Object.assign({}, edge, { label });
    const a = geom.get(e.from), b = geom.get(e.to);
    const col = emphColor(e.emphasis);
    const dash = edgeDash(e);
    const hollow = e.kind === "return" || e.kind === "returns";
    const width = emphWidth(e.emphasis);
    const g = s("g", {});
    if (back.has(i)) {
      const rx = PAD + widest + 16;
      const sx = a.x + a.w, sy = a.cy, tx = b.x + b.w, ty = b.cy;
      g.append(s("path", { d: `M ${sx} ${sy} C ${rx + 14} ${sy}, ${rx + 14} ${ty}, ${tx + 8} ${ty}`,
        fill: "none", stroke: col, "stroke-width": width, "stroke-dasharray": dash }));
      g.append(arrowHead(tx + 1, ty, "left", col, hollow));
      if (e.label) g.append(s("text", { x: rx + 8, y: (sy + ty) / 2, class: "dg-label",
        "text-anchor": "middle", transform: `rotate(-90 ${rx + 8} ${(sy + ty) / 2})`,
        fill: col, text: e.label }));
    } else {
      const x1 = a.cx, y1 = a.y + a.h, x2 = b.cx, y2 = b.y - 7;
      const mid = (y2 - y1) / 2;
      g.append(s("path", { d: `M ${x1} ${y1} C ${x1} ${y1 + mid}, ${x2} ${y2 - mid}, ${x2} ${y2}`,
        fill: "none", stroke: col, "stroke-width": width, "stroke-dasharray": dash }));
      g.append(arrowHead(x2, y2 + 6, "down", col, hollow));
      if (e.label) {
        const lines = wrapText(e.label, NW, 11, 2);
        const lx = (x1 + x2) / 2 + (x2 === x1 ? 10 : 0);
        let ly = y1 + (y2 - y1) / 2 + 4 - (lines.length - 1) * 6;
        for (const line of lines) {
          const tw = textWidth(line, 11) + 8;
          g.append(s("rect", { x: lx - tw / 2, y: ly - 11, width: tw, height: 15, rx: 3,
            fill: "var(--panel)", "fill-opacity": .92 }));
          g.append(s("text", { x: lx, y: ly, class: "dg-label", "text-anchor": "middle",
            fill: e.emphasis === "unchanged" ? "var(--ink-soft)" : col, text: line }));
          ly += 13;
        }
      }
    }
    svg.append(g);
  });

  for (const n of nodes) {
    const g = geom.get(n.id);
    const col = emphColor(n.emphasis);
    const fill = (n.emphasis === "added" || n.emphasis === "changed")
      ? "var(--accent-fill)" : "var(--panel)";
    const box = s("g", {});
    box.append(nodeShape(n.kind, g, fill, col, n.emphasis));
    const lines = wrapped.get(n.id);
    const sub = subs.get(n.id);
    const block = lines.length * 14 + (sub ? 13 : 0);
    let ty = g.y + g.h / 2 - block / 2 + 11;
    for (const line of lines) {
      box.append(s("text", { x: g.cx, y: ty, class: "dg-label", "text-anchor": "middle",
        fill: "var(--ink)", "font-weight": n.emphasis === "unchanged" ? 400 : 600, text: line }));
      ty += 14;
    }
    if (sub) {
      box.append(s("text", { x: g.cx, y: ty, class: "dg-label", "text-anchor": "middle",
        "font-size": 9.5, fill: "var(--ink-faint)", text: sub }));
    }
    svg.append(box);
  }

  return { node: svg, naturalWidth: W };
}

/* ------------------------------------------------------ sequence diagram */
function drawSequence(d) {
  const lanes = d.lanes || [];
  const edges = (d.edges || []).filter(e =>
    lanes.some(l => l.id === e.from) && lanes.some(l => l.id === e.to));
  const notes = (d.nodes || []).filter(n => n.lane);

  let LW = 150;
  for (const l of lanes) LW = Math.max(LW, Math.min(260, longestWord(l.label, 12) + 34));
  LW = Math.round(LW);
  const heads = new Map(lanes.map(l => [l.id, wrapText(l.label, LW - 22, 12, 2)]));
  const headLines = Math.max(1, ...Array.from(heads.values(), ls => ls.length));

  const PAD = 14, TOP = 10, ROW = 44;
  const HEAD_H = 26 + headLines * 15;
  const W = Math.round(PAD * 2 + LW * lanes.length);
  const bodyTop = TOP + HEAD_H + 28;
  const cx = i => PAD + LW * i + LW / 2;
  const idx = new Map(lanes.map((l, i) => [l.id, i]));

  /* Lay the rows out first: a two-line label needs the room before anything is
     drawn on top of it. */
  const laid = [];
  let y = bodyTop;
  for (const e of edges) {
    const a = idx.get(e.from), b = idx.get(e.to);
    const room = a === b ? LW - 40 : Math.abs(cx(b) - cx(a)) + LW * 0.5;
    const lines = e.label ? wrapText(e.label, room, 11.5, 2) : [];
    laid.push({ e, y, lines });
    y += ROW + (lines.length > 1 ? 14 : 0);
  }
  const noteLaid = notes.map(n => {
    const lines = wrapText(n.label, LW + 24, 11.5, 2);
    const at = y;
    y += 22 + lines.length * 14;
    return { n, y: at, lines };
  });
  const H = Math.round(y + 12);

  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H,
    role: "img", "aria-label": (d.title || "sequence") + " diagram" });

  lanes.forEach((l, i) => {
    const x = cx(i);
    svg.append(s("line", { x1: x, y1: TOP + HEAD_H, x2: x, y2: H - 12,
      stroke: "var(--line)", "stroke-width": 1, "stroke-dasharray": "3 4" }));
    svg.append(s("rect", { x: x - LW / 2 + 8, y: TOP, width: LW - 16, height: HEAD_H, rx: 4,
      fill: "var(--panel-soft)", stroke: "var(--line)" }));
    let ly = TOP + HEAD_H / 2 - (heads.get(l.id).length - 1) * 7 + 4.5;
    for (const line of heads.get(l.id)) {
      svg.append(s("text", { x, y: ly, class: "dg-lane", "text-anchor": "middle",
        fill: "var(--ink)", text: line }));
      ly += 15;
    }
  });

  for (const { e, y: ey, lines } of laid) {
    const a = idx.get(e.from), b = idx.get(e.to);
    const col = emphColor(e.emphasis);
    const dash = edgeDash(e);
    const hollow = e.kind === "return";
    const g = s("g", {});
    if (a === b) {
      const x = cx(a);
      g.append(s("path", { d: `M ${x} ${ey} h 26 v 16 h -26`, fill: "none",
        stroke: col, "stroke-width": emphWidth(e.emphasis), "stroke-dasharray": dash }));
      g.append(arrowHead(x + 1, ey + 16, "left", col, hollow));
      let ly = ey + 12 - (lines.length - 1) * 7;
      for (const line of lines) {
        g.append(s("text", { x: x + 34, y: ly, class: "dg-label",
          fill: "var(--ink-soft)", text: line }));
        ly += 14;
      }
    } else {
      const x1 = cx(a), x2 = cx(b);
      const dir = x2 > x1 ? 1 : -1;
      g.append(s("line", { x1, y1: ey, x2: x2 - dir * 6, y2: ey, stroke: col,
        "stroke-width": emphWidth(e.emphasis), "stroke-dasharray": dash }));
      g.append(arrowHead(x2 - dir * 6, ey, dir > 0 ? "right" : "left", col, hollow));
      let ly = ey - 7 - (lines.length - 1) * 13;
      for (const line of lines) {
        g.append(s("text", { x: (x1 + x2) / 2, y: ly, class: "dg-label", "text-anchor": "middle",
          fill: e.emphasis === "unchanged" ? "var(--ink-soft)" : col,
          "font-weight": e.emphasis === "unchanged" ? 400 : 600, text: line }));
        ly += 13;
      }
    }
    svg.append(g);
  }

  for (const { n, y: ny, lines } of noteLaid) {
    const x = cx(idx.get(n.lane) || 0);
    const w = Math.min(LW + 40, Math.max(...lines.map(l => textWidth(l, 11.5))) + 20);
    const hh = 10 + lines.length * 14;
    svg.append(s("rect", { x: x - w / 2, y: ny, width: w, height: hh, rx: 4,
      fill: "var(--panel-soft)", stroke: emphColor(n.emphasis),
      "stroke-dasharray": n.emphasis === "removed" ? "5 4" : null }));
    let ly = ny + 15;
    for (const line of lines) {
      svg.append(s("text", { x, y: ly, class: "dg-label", "text-anchor": "middle",
        fill: "var(--ink-soft)", text: line }));
      ly += 14;
    }
  }

  return { node: svg, naturalWidth: W };
}

/* A returned value gets a hollow head; a call gets a solid one. */
function arrowHead(x, y, dir, color, hollow) {
  const p = { right: `${x},${y} ${x - 7},${y - 4} ${x - 7},${y + 4}`,
              left: `${x},${y} ${x + 7},${y - 4} ${x + 7},${y + 4}`,
              down: `${x},${y} ${x - 4},${y - 7} ${x + 4},${y - 7}`,
              up: `${x},${y} ${x - 4},${y + 7} ${x + 4},${y + 7}` }[dir];
  return hollow
    ? s("polygon", { points: p, fill: "var(--panel)", stroke: color, "stroke-width": 1.3 })
    : s("polygon", { points: p, fill: color });
}

function wrapText(text, maxPx, size, maxLines) {
  const per = size * 0.56;
  const max = Math.max(6, Math.floor(maxPx / per));
  /* A word two characters over the line is better left to overhang than cut in
     half: `session.request(timeout)` must not become `timeou` / `t)`. */
  const hard = max + 4;
  const words = String(text).replace(/`/g, "").split(/\s+/);
  const lines = [];
  let cur = "";
  for (let word of words) {
    while (word.length > hard) {
      if (cur) { lines.push(cur); cur = ""; }
      lines.push(word.slice(0, max - 1) + "­");
      word = word.slice(max - 1);
    }
    if (!cur) cur = word;
    else if (cur.length + 1 + word.length <= max) cur += " " + word;
    else { lines.push(cur); cur = word; }
  }
  if (cur) lines.push(cur);
  return lines.slice(0, maxLines || 3);
}

/* ---------------------------------------------------------------- footer */
/* Provenance: how this report was made, what it was read from, and what it did
   not read. None of it is a fact about the change, so none of it is upstairs. */
function coverageNotice() {
  const c = M.coverage || {};
  const limits = c.limitations || [];
  /* Absent means precis never looked at the project's rules, and `limitations`
     owes the reader a reason. An empty list means it looked and this change
     touches nothing that states any. Those are different answers, so a clean
     full reading still shows the notice when there is one to give. */
  const rules = Array.isArray(c.rules_read) ? c.rules_read : null;
  if (c.tier === "full" && !limits.length && rules === null) return null;
  const tierText = {
    full: "Every hunk was read.",
    core: "Core and supporting hunks were read in full; mechanical groups were summarised.",
    summary: "This change was read at file level only."
  }[c.tier] || "";
  return [
    h("p", { class: "prov" }, prose(c.note || tierText), " ",
      h("span", { class: "faint",
        text: `${c.hunks_read} of ${c.hunks_total} hunks, ${c.files_read} of ${c.files_total} files.` })),
    rules === null ? null : h("p", { class: "prov", text: rules.length
      ? `Rules read: ${rules.join(", ")}.`
      : "Rules read: no rules document sits above the code this change touches." }),
    limits.length ? h("ul", {}, limits.map(l => h("li", {}, prose(l)))) : null
  ];
}

function footerNode() {
  const src = M.source || {};
  const story = M.story || {};
  const dl = (term, value) => value ? h("div", {}, h("dt", { text: term }), h("dd", { text: value })) : null;
  const evidence = (story.evidence || []).map(e => EVIDENCE_LABEL[e] || e);
  const conf = { high: "high", medium: "medium", low: "low" }[story.confidence] || story.confidence;
  return h("footer", {},
    h("div", { class: "wrap" },
      h("div", { class: "cols" },
        dl("Source", SOURCE_KIND_LABEL[src.kind] || src.kind),
        dl("Base", src.base && (src.base.sha || src.base.ref)
          ? `${src.base.ref || "?"} @ ${(src.base.sha || "unknown").slice(0, 12)}` : "not recorded"),
        dl("Head", src.head && (src.head.sha || src.head.ref)
          ? `${src.head.ref || "?"} @ ${(src.head.sha || "unknown").slice(0, 12)}` : "not recorded"),
        dl("Generated by", src.generated_by),
        dl("Generated at", src.generated_at),
        dl("Schema", M.schema_version)
      ),
      conf ? h("p", { class: "prov" },
        `The story above was read from ${evidence.length ? listOf(evidence) : "the code"}`
        + `, with ${conf} confidence.`) : null,
      coverageNotice(),
      h("p", { class: "creed",
        text: "precis is not a code review tool. It is a tool that helps humans review code. "
          + "Nothing in this report is a verdict on the change; the reading is still yours to do." })
    ));
}

/* ------------------------------------------------------------------ boot */
function boot() {
  const app = document.getElementById("app");
  const chapters = buildChapters();
  app.append(masthead(chapters));
  const main = h("main", { class: "wrap" });
  for (const c of chapters) if (c.node) main.append(c.node);
  app.append(main);
  app.append(footerNode());

  /* Margin notes track the layout: any reflow - a resize, a fold opening,
     the fonts arriving - re-places them. */
  WIDE.addEventListener("change", placeAllMarginNotes);
  if (typeof ResizeObserver === "function") {
    new ResizeObserver(placeAllMarginNotes).observe(document.body);
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(placeAllMarginNotes);
  }
  requestAnimationFrame(placeAllMarginNotes);

  /* Printing must not silently drop the parts that happen to be collapsed,
     and paper gets the inline notes, so the margin geometry comes off. */
  let reopened = [];
  addEventListener("beforeprint", () => {
    reopened = Array.from(document.querySelectorAll("details:not([open])"));
    for (const d of reopened) d.open = true;
    for (const wrap of SNIPWRAPS) wrap.style.minHeight = "";
  });
  addEventListener("afterprint", () => {
    for (const d of reopened) d.open = false;
    placeAllMarginNotes();
  });
}

boot();
</script>
