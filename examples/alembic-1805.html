<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add configurable revision_map_class option #1805</title>
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  color-scheme: light dark;

  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
  --serif: ui-serif, Charter, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;

  --bg: #fbfaf8;
  --bg-soft: #f3f1ec;
  --panel: #ffffff;
  --panel-soft: #f8f6f2;
  --line: #e0dad0;
  --line-soft: #ebe6dd;
  --ink: #1d1c1a;
  --ink-soft: #55504a;
  --ink-faint: #8b857b;
  --accent: #2c6f5d;
  --accent-ink: #1f5748;
  --accent-wash: #e6f0ec;

  --k-new_logic: #2f8f5b;
  --k-modified_logic: #bf7a1c;
  --k-deleted: #c0424f;
  --k-moved: #3070ad;
  --k-rename: #7457bd;
  --k-content: #8a7546;
  --k-generated: #40858c;
  --k-formatting: #8e9299;

  --sig-core: #2c6f5d;
  --sig-supporting: #7fa79a;
  --sig-mechanical: #cfc9be;

  --add-bg: #e8f5ec;
  --add-ink: #1c6b3f;
  --del-bg: #fbebec;
  --del-ink: #9c2f39;
  --add-gut: #bfe2cb;
  --del-gut: #f0c3c7;

  --tok-key: #8a4fa8;
  --tok-str: #1f6b57;
  --tok-com: #94908a;
  --tok-num: #a35b1e;

  --shadow: 0 1px 2px rgba(28, 26, 22, .05), 0 6px 18px -12px rgba(28, 26, 22, .28);
  --radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312;
    --bg-soft: #191918;
    --panel: #1a1a19;
    --panel-soft: #201f1e;
    --line: #33312e;
    --line-soft: #292826;
    --ink: #eae7e1;
    --ink-soft: #aaa49b;
    --ink-faint: #7d776e;
    --accent: #6fbca4;
    --accent-ink: #8ed3bc;
    --accent-wash: #1b2b27;

    --k-new_logic: #56c087;
    --k-modified_logic: #d99f46;
    --k-deleted: #e0737f;
    --k-moved: #61a3e0;
    --k-rename: #a78be6;
    --k-content: #bda86f;
    --k-generated: #5fb5bd;
    --k-formatting: #8e9299;

    --sig-core: #6fbca4;
    --sig-supporting: #47756a;
    --sig-mechanical: #3b3936;

    --add-bg: #14291d;
    --add-ink: #7ed3a1;
    --del-bg: #2c1618;
    --del-ink: #e88b95;
    --add-gut: #2c5c3f;
    --del-gut: #5f2b31;

    --tok-key: #c48ae0;
    --tok-str: #7fc9ae;
    --tok-com: #797369;
    --tok-num: #d9a06b;

    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px -14px rgba(0, 0, 0, .7);
  }
}

:root[data-theme="dark"] {
  --bg: #131312;
  --bg-soft: #191918;
  --panel: #1a1a19;
  --panel-soft: #201f1e;
  --line: #33312e;
  --line-soft: #292826;
  --ink: #eae7e1;
  --ink-soft: #aaa49b;
  --ink-faint: #7d776e;
  --accent: #6fbca4;
  --accent-ink: #8ed3bc;
  --accent-wash: #1b2b27;

  --k-new_logic: #56c087;
  --k-modified_logic: #d99f46;
  --k-deleted: #e0737f;
  --k-moved: #61a3e0;
  --k-rename: #a78be6;
  --k-content: #bda86f;
  --k-generated: #5fb5bd;
  --k-formatting: #8e9299;

  --sig-core: #6fbca4;
  --sig-supporting: #47756a;
  --sig-mechanical: #3b3936;

  --add-bg: #14291d;
  --add-ink: #7ed3a1;
  --del-bg: #2c1618;
  --del-ink: #e88b95;
  --add-gut: #2c5c3f;
  --del-gut: #5f2b31;

  --tok-key: #c48ae0;
  --tok-str: #7fc9ae;
  --tok-com: #797369;
  --tok-num: #d9a06b;

  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px -14px rgba(0, 0, 0, .7);
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 var(--sans);
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, h4 { margin: 0; font-weight: 620; letter-spacing: -.011em; line-height: 1.25; }
p { margin: 0; }
a { color: var(--accent-ink); text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 2px; }
/* `anywhere` rather than `break-word`: a long test name in prose has to be able
   to shrink the paragraph, not widen the page. */
code { font: .875em/1.5 var(--mono); background: var(--panel-soft); border: 1px solid var(--line-soft); border-radius: 4px; padding: .08em .32em; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }
.prose { max-width: 68ch; }

/* ------------------------------------------------------------- masthead */
.masthead { background: var(--bg-soft); border-bottom: 1px solid var(--line); padding: 34px 0 26px; }
.eyebrow {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  font-size: 12.5px; color: var(--ink-faint); margin-bottom: 16px;
}
.eyebrow .sep { opacity: .5; }
.eyebrow b { font-weight: 600; color: var(--ink-soft); }
.brand {
  font: 600 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  border-radius: 999px; padding: 4px 9px;
}
.headline { font-size: clamp(26px, 3.4vw, 38px); max-width: 27ch; text-wrap: balance; }
/* The story is beats, not a paragraph: three clauses a person would say out
   loud, in a shape the eye takes in before it starts reading. */
.beats { margin-top: 24px; display: grid; gap: 11px; max-width: 70ch; }
.beat { display: grid; grid-template-columns: minmax(52px, max-content) minmax(0, 1fr); gap: 0 16px; }
.beat .bl {
  font: 650 11px/2.1 var(--sans); letter-spacing: .09em; text-transform: uppercase;
  color: var(--accent-ink); text-align: right; white-space: nowrap;
}
.beat .bt {
  font: 16.5px/1.6 var(--serif); color: var(--ink);
  border-left: 2px solid var(--line); padding-left: 16px;
}
.caveat {
  margin-top: 14px; max-width: 66ch; font-size: 14px; color: var(--ink-soft);
  border-left: 3px solid var(--k-modified_logic); padding: 2px 0 2px 12px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; line-height: 1; padding: 5px 9px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); white-space: nowrap;
}
.chip.lead { border-color: color-mix(in srgb, var(--accent) 32%, transparent); color: var(--accent-ink); background: var(--accent-wash); }
.chip.dim { background: transparent; color: var(--ink-faint); }
.chips .label { font-size: 11.5px; color: var(--ink-faint); margin-right: 2px; }

/* -------------------------------------------------------------- metrics */
.metrics {
  margin-top: 26px; display: grid; gap: 22px;
  grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
  align-items: center;
}
.ratio { display: flex; align-items: baseline; gap: 10px; }
.ratio .num { font-size: 46px; font-weight: 640; letter-spacing: -.03em; color: var(--accent-ink); line-height: 1; }
.ratio .cap { font-size: 13px; color: var(--ink-soft); max-width: 17ch; line-height: 1.35; }
.bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--line-soft); }
.bar span { display: block; min-width: 2px; }
.bar .s-core { background: var(--sig-core); }
.bar .s-supporting { background: var(--sig-supporting); }
.bar .s-mechanical { background: var(--sig-mechanical); }
.barkey { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); }
.barkey i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 13px; color: var(--ink-soft); }
.facts b { font-weight: 600; color: var(--ink); }

/* ------------------------------------------------------------------ nav */
.nav {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(10px);
  backdrop-filter: saturate(180%) blur(10px);
  border-bottom: 1px solid var(--line);
}
.nav .wrap { display: flex; align-items: center; gap: 4px; height: 46px; overflow-x: auto; scrollbar-width: none; }
.nav .wrap::-webkit-scrollbar { display: none; }
.nav a {
  font-size: 13px; color: var(--ink-soft); text-decoration: none; white-space: nowrap;
  padding: 6px 10px; border-radius: 7px;
}
.nav a:hover { background: var(--bg-soft); color: var(--ink); }
.nav a.on { color: var(--accent-ink); background: var(--accent-wash); }
.nav .spacer { flex: 1; }
.iconbtn {
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px;
  font-size: 12px; color: var(--ink-soft); background: var(--panel); white-space: nowrap;
}
.iconbtn:hover { color: var(--ink); border-color: var(--ink-faint); }

/* -------------------------------------------------------------- section */
section { padding: 46px 0 8px; scroll-margin-top: 58px; }
.shead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.shead h2 { font-size: 21px; }
.shead .count { font-size: 12.5px; color: var(--ink-faint); }
.slead { font-size: 14.5px; color: var(--ink-soft); max-width: 72ch; margin-bottom: 22px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.pad { padding: 18px 20px; }

/* -------------------------------------------------------------- notices */
.notice {
  border: 1px solid var(--line); border-left: 3px solid var(--k-modified_logic);
  background: var(--panel); border-radius: 8px; padding: 14px 16px; margin-bottom: 22px;
}
.notice h3 { font-size: 14px; margin-bottom: 4px; }
.notice p, .notice li { font-size: 13.5px; color: var(--ink-soft); }
.notice ul { margin: 8px 0 0; padding-left: 18px; }
.notice li { margin-top: 3px; }

details.disclose { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
details.disclose > summary {
  cursor: pointer; list-style: none; padding: 10px 14px; font-size: 13px; color: var(--ink-soft);
  display: flex; align-items: center; gap: 8px;
}
details.disclose > summary::-webkit-details-marker { display: none; }
details.disclose > summary::before {
  content: ""; width: 0; height: 0; border: 5px solid transparent;
  border-left-color: var(--ink-faint); transition: transform .15s ease; flex: none;
}
details.disclose[open] > summary::before { transform: rotate(90deg) translateX(-1px); }
details.disclose > .inner { padding: 0 14px 14px; }
.rawdesc {
  font: 13px/1.6 var(--mono); white-space: pre-wrap; color: var(--ink-soft);
  border-left: 2px solid var(--line); padding-left: 12px; max-width: 84ch;
}

/* ----------------------------------------------------------- intent map */
/* Intent used to be a section with a lead paragraph, for two lines of content.
   It is a strip under the masthead now, and opens when there is something to
   reconcile. */
.intent { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 18px; }
.intent > summary { cursor: pointer; list-style: none; }
.intent > summary::-webkit-details-marker { display: none; }
.intent .srow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.intent .lbl { font: 650 11px/1.9 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); flex: none; }
.intent .says { font: 15px/1.6 var(--serif); color: var(--ink-soft); flex: 1 1 320px; min-width: 0; }
.intent .counts { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.intent .counts::after {
  content: ""; width: 0; height: 0; border: 5px solid transparent;
  border-left-color: var(--ink-faint); transition: transform .15s ease;
}
.intent[open] .counts::after { transform: rotate(90deg) translateX(-1px); }
.intent .pill {
  font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
}
.intent .pill.on { border-color: color-mix(in srgb, var(--k-modified_logic) 45%, transparent); color: var(--k-modified_logic); }
.deltas { display: grid; gap: 12px; margin-top: 18px; }
.delta { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 14px 16px; }
.delta .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.delta p { font-size: 14.5px; color: var(--ink); }
.delta .note { font-size: 13px; color: var(--ink-faint); margin-top: 6px; }
.delta .where { font: 12px/1.5 var(--mono); color: var(--ink-faint); margin-top: 8px; word-break: break-all; }
.tag {
  font-size: 11px; letter-spacing: .03em; text-transform: uppercase; font-weight: 600;
  padding: 3px 8px; border-radius: 5px; background: var(--bg-soft); color: var(--ink-soft);
  border: 1px solid var(--line-soft); white-space: nowrap;
}
.tag.t-scope_creep { color: var(--k-moved); border-color: color-mix(in srgb, var(--k-moved) 35%, transparent); }
.tag.t-drive_by { color: var(--k-content); border-color: color-mix(in srgb, var(--k-content) 35%, transparent); }
.tag.t-incidental { color: var(--k-modified_logic); border-color: color-mix(in srgb, var(--k-modified_logic) 35%, transparent); }
.tag.t-notdone { color: var(--ink-faint); }

/* ----------------------------------------------------------- change map */
.graphwrap {
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
  padding: 18px 12px; overflow-x: auto;
}
.graphwrap svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.gnode { cursor: pointer; }
.gnode:hover .gbox { stroke-width: 2.8; }
.g-sub { font-family: var(--mono); font-size: 9.5px; }
.offgraph { margin-top: 14px; font-size: 13.5px; color: var(--ink-soft); max-width: 78ch; }
.offgraph b { color: var(--ink); font-weight: 650; }
.offgraph .og { font-size: 12.5px; color: var(--ink-faint); }
.tip {
  position: fixed; z-index: 60; pointer-events: none; max-width: 320px;
  background: var(--ink); color: var(--bg); border-radius: 7px; padding: 8px 10px;
  font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px -8px rgba(0,0,0,.5);
}
.tip .p { font-family: var(--mono); font-size: 11.5px; word-break: break-all; opacity: .85; }
.tip .m { margin-top: 4px; opacity: .7; }

.ledger { margin-top: 22px; }
.ledger > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-soft); }
.ledger > summary::-webkit-details-marker { display: none; }
.ledger > summary::before {
  content: ""; width: 0; height: 0; border: 5px solid transparent;
  border-left-color: var(--ink-faint); transition: transform .15s ease; flex: none;
}
.ledger[open] > summary::before { transform: rotate(90deg) translateX(-1px); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 16px 0 0; font-size: 12.5px; color: var(--ink-soft); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.grouplist { margin-top: 14px; display: grid; gap: 10px; }
.group { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
.group > summary {
  cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; flex-wrap: wrap;
}
.group > summary::-webkit-details-marker { display: none; }
.group > summary::before {
  content: ""; width: 0; height: 0; border: 5px solid transparent;
  border-left-color: var(--ink-faint); transition: transform .15s ease; flex: none;
}
.group[open] > summary::before { transform: rotate(90deg) translateX(-1px); }
.group .glabel { font-weight: 600; font-size: 14.5px; }
.group .gsum { font-size: 13px; color: var(--ink-faint); flex: 1 1 220px; }
.group .gnum { font: 12px/1 var(--mono); color: var(--ink-faint); }
.role {
  font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 650;
  color: var(--ink-faint); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px;
}
table.files { width: 100%; border-collapse: collapse; font-size: 13px; }
table.files td { padding: 7px 14px; border-top: 1px solid var(--line-soft); vertical-align: top; }
table.files tr.flash td { background: var(--accent-wash); }
table.files .fp { font: 12.5px/1.5 var(--mono); overflow-wrap: anywhere; }
table.files .fp .dir { color: var(--ink-faint); }
table.files .moved { display: block; font-size: 11.5px; color: var(--ink-faint); }
table.files .num { text-align: right; white-space: nowrap; font: 12px/1.5 var(--mono); }
table.files .plus { color: var(--add-ink); }
table.files .minus { color: var(--del-ink); }
table.files .note { color: var(--ink-soft); font-size: 12.5px; margin-top: 3px; max-width: 62ch; }
.kindchip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
.kindchip i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.sigdot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; flex: none; }

/* ------------------------------------------------------------- behavior */
.diagrams { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.diagrams.stacked { grid-template-columns: minmax(0, 1fr); }
.dcard { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
.dcard h3 {
  font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint);
  padding: 10px 14px; border-bottom: 1px solid var(--line-soft); font-weight: 650;
}
.dcard .dbody { padding: 12px; overflow-x: auto; }
.dcard svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.dg-label { font-family: var(--sans); font-size: 11.5px; }
.dg-lane { font-family: var(--sans); font-size: 12px; font-weight: 600; }
.dkey { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; font-size: 12.5px; color: var(--ink-soft); }
.dkey i { width: 16px; height: 0; border-top-width: 2px; border-top-style: solid; display: inline-block; margin-right: 6px; vertical-align: 4px; }
.bdeltas { margin-top: 20px; display: grid; gap: 10px; }
.bdelta { display: flex; gap: 12px; align-items: flex-start; font-size: 14.5px; }
.bdelta .mk { color: var(--accent); flex: none; line-height: 1.6; }

/* ---------------------------------------------------------- review pass */
.passbar {
  position: sticky; top: 46px; z-index: 20; margin-bottom: 26px;
  display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap;
  /* Solid, not blurred: the nav above it already composites a blur layer, and
     a second one costs more than it is worth. */
  background: var(--bg-soft);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px;
}
.pbar { flex: 1 1 180px; min-width: 110px; height: 8px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .22s ease; }
.pcount { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.pcount b { color: var(--ink); font-weight: 650; }
.pdone { color: var(--accent-ink); font-weight: 650; }
.passbtns { display: flex; gap: 8px; }
.copyout {
  width: 100%; min-height: 180px; margin-top: 12px; padding: 10px 12px;
  font: 12px/1.6 var(--mono); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; resize: vertical;
}
.passgroup { margin-bottom: 36px; }
.gh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.gh h3 { font: 650 11.5px/1.6 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); }
.gh .sub { font-size: 13px; color: var(--ink-faint); }

.steps { display: grid; gap: 14px; }
/* Grid items refuse to shrink below their content by default, and one long
   token in a hunk is enough to push the whole page sideways on a phone. */
.step { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
.step > .head { display: flex; gap: 14px; padding: 18px 20px 0; }
/* A number inside a box reads as a badge, not as something you click. So the
   box carries nothing but a tick: ghosted at rest so the affordance is legible,
   solid once it is ticked. The ordinal moves into the heading, where it is
   wayfinding rather than a control. */
.tick {
  flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 7px;
  cursor: pointer; padding: 0; display: grid; place-items: center;
  border: 1.5px solid var(--ink-faint); background: var(--panel-soft); color: var(--ink-faint);
  transition: background .14s ease, border-color .14s ease, color .14s ease;
}
.tick .mark { font-size: 16px; line-height: 1; opacity: .3; transition: opacity .14s ease; }
.tick:hover { border-color: var(--accent); color: var(--accent-ink); }
.step:hover .tick .mark, .tick:hover .mark { opacity: .6; }
.step.done .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .step.done .tick { color: #10201c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .step.done .tick { color: #10201c; } }
.step.done .tick .mark, .step.done:hover .tick .mark { opacity: 1; }
.step.flash { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Ticking folds the body away, the way a viewed file collapses. The head stays,
   so a finished pass still reads as a list of what was done rather than a
   column of empty bars. The tick alone carries the finished signal: dimming a
   card that is already closed says the same thing twice. */
.step.folded > .body { display: none; }
.step.folded > .head { padding-bottom: 16px; }
.fold {
  flex: none; align-self: flex-start; margin-top: 2px; padding: 4px 7px;
  border: 0; border-radius: 6px; background: none; cursor: pointer;
  color: var(--ink-faint); display: grid; place-items: center;
  transition: color .14s ease, background .14s ease;
}
.fold:hover { color: var(--accent-ink); background: var(--accent-wash); }
.fold .chev {
  width: 0; height: 0; border: 5px solid transparent;
  border-top-color: currentColor; margin-top: 3px;
  transition: transform .15s ease;
}
.step.folded .fold .chev { transform: rotate(-90deg) translateY(2px); }
.step .htext { min-width: 0; flex: 1; }
.step h3 { font-size: 17px; }
.step h3 .ord { font: 650 12.5px/1 var(--mono); color: var(--ink-faint); margin-right: 9px; vertical-align: 1px; }
.step .why { font: 15px/1.65 var(--serif); color: var(--ink-soft); margin-top: 7px; max-width: 64ch; }
.step .path { font: 12px/1.5 var(--mono); color: var(--ink-faint); margin-top: 8px; word-break: break-all; }
.step .hunks { padding: 16px 20px 20px; display: grid; gap: 12px; }
.step .tail { padding: 14px 20px 18px 60px; }
/* The project's own words, set apart from precis's. A reader can go to the
   line and read the rule rather than taking this report's word for it. */
.rule { border-left: 2px solid var(--line); padding-left: 14px; margin-bottom: 14px; }
.rule .said { font: 15px/1.6 var(--serif); color: var(--ink); max-width: 64ch; }
.rule .said + .said { margin-top: 8px; }
.rule .lbl {
  font: 650 10.5px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-faint); margin-right: 9px; vertical-align: 1.5px;
}
.rule .src { font: 11.5px/1.5 var(--mono); color: var(--ink-faint); margin-top: 9px; }

/* The one place in the report that asks the reader for something. */
.q { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-wash); border-radius: 9px; padding: 12px 14px; }
.q .mk { color: var(--accent-ink); font-weight: 700; flex: none; line-height: 1.5; }
.q p { font: 15px/1.55 var(--sans); color: var(--accent-ink); max-width: 64ch; }

.skipwrap { margin-top: 30px; }
.skipwrap .lead { font-size: 14px; color: var(--ink-soft); max-width: 72ch; margin-bottom: 14px; }
.skip { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-soft); margin-bottom: 10px; }
.skip > summary { cursor: pointer; list-style: none; padding: 13px 16px; }
.skip > summary::-webkit-details-marker { display: none; }
.skip .srow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.skip .srow::before {
  content: ""; width: 0; height: 0; border: 5px solid transparent;
  border-left-color: var(--ink-faint); transition: transform .15s ease; flex: none;
}
.skip[open] .srow::before { transform: rotate(90deg) translateX(-1px); }
.skip .slabel { font-weight: 600; font-size: 14.5px; }
.skip .smeta { font: 12px/1 var(--mono); color: var(--ink-faint); }
.skip .reason { font-size: 13.5px; color: var(--ink-soft); margin: 8px 0 0 20px; max-width: 76ch; }
.skip .inner { padding: 4px 16px 16px 36px; }
.skip .filelist { font: 12px/1.85 var(--mono); color: var(--ink-soft); columns: 2; column-gap: 26px; }
.skip .filelist div { break-inside: avoid; word-break: break-all; }

/* --------------------------------------------------------------- seams */
.seams { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.seam { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 15px 17px; }
.seam h3 { font-size: 15px; margin-bottom: 6px; }
.seam p { font-size: 13.5px; color: var(--ink-soft); }
.seam .meta { font: 12px/1.6 var(--mono); color: var(--ink-faint); margin-top: 10px; }

/* --------------------------------------------------------------- hunks */
.hunkrefs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
.hunkrefs .label { font-size: 11.5px; color: var(--ink-faint); }
.href {
  font: 11.5px/1 var(--mono); border: 1px solid var(--line); border-radius: 5px;
  padding: 5px 8px; color: var(--ink-soft); background: var(--panel-soft);
}
.href:hover { border-color: var(--accent); color: var(--accent-ink); }
.href[aria-expanded="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-wash); }
.slot:not(:empty) { margin-top: 10px; display: grid; gap: 10px; }

.hunk { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.hunk .hhead {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--panel-soft); border-bottom: 1px solid var(--line-soft);
}
.hunk .hpath { font: 12px/1.4 var(--mono); font-weight: 600; word-break: break-all; }
.hunk .hmeta { font: 11.5px/1.4 var(--mono); color: var(--ink-faint); }
.hunk .hsec { font: 11.5px/1.4 var(--mono); color: var(--ink-faint); flex: 1 1 auto; text-align: right; word-break: break-all; }
/* Code soft-wraps, so this only engages for a single token wider than the
   viewport. When it does, the hunk scrolls, never the page. */
.hbody { font: 12.5px/1.6 var(--mono); tab-size: 4; overflow-x: auto; }
.hline { display: flex; align-items: flex-start; }
.hline .gut {
  flex: none; display: flex; user-select: none; color: var(--ink-faint); font-size: 11px;
  padding-top: 1px;
}
.hline .gut span { display: inline-block; width: 3.3em; text-align: right; padding-right: .7em; }
.hline .sign { flex: none; width: 1.2em; text-align: center; color: var(--ink-faint); }
.hline .code { flex: 1 1 auto; min-width: 0; white-space: pre-wrap; overflow-wrap: break-word; padding: 0 12px 0 0; text-indent: -2.4ch; padding-left: 2.4ch; }
.hline.add { background: var(--add-bg); }
.hline.add .sign { color: var(--add-ink); }
.hline.add .gut { background: var(--add-gut); color: color-mix(in srgb, var(--add-ink) 85%, transparent); }
.hline.del { background: var(--del-bg); }
.hline.del .sign { color: var(--del-ink); }
.hline.del .gut { background: var(--del-gut); color: color-mix(in srgb, var(--del-ink) 85%, transparent); }
.hline.ctx .gut { background: var(--panel-soft); }
/* An annotation must not read as one more added line: it is precis talking,
   not the diff. Panel background against the tinted rows does that. */
.hnote {
  display: flex; gap: 9px; align-items: flex-start;
  background: var(--panel); border-left: 3px solid var(--accent);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 10px 16px 10px 11px; font: 13.5px/1.55 var(--sans); color: var(--ink);
}
.hnote .mk { color: var(--accent); font-weight: 700; flex: none; }
.hnote .txt { max-width: 70ch; }
.trunc {
  padding: 7px 12px; font: 11.5px/1.5 var(--mono); color: var(--ink-faint);
  background: repeating-linear-gradient(-45deg, transparent, transparent 6px, var(--line-soft) 6px, var(--line-soft) 7px);
  border-top: 1px solid var(--line-soft);
}
.tk { color: inherit; }
.tk-key { color: var(--tok-key); }
.tk-str { color: var(--tok-str); }
.tk-com { color: var(--tok-com); font-style: italic; }
.tk-num { color: var(--tok-num); }

/* -------------------------------------------------------------- footer */
footer { margin-top: 56px; border-top: 1px solid var(--line); background: var(--bg-soft); padding: 26px 0 40px; }
footer .cols { display: flex; flex-wrap: wrap; gap: 26px 44px; font-size: 12.5px; color: var(--ink-faint); }
footer dt { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 3px; }
footer dd { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); word-break: break-all; }
footer .creed { margin-top: 22px; font-size: 13px; color: var(--ink-soft); max-width: 62ch; }

/* ------------------------------------------------------------ responsive */
@media (max-width: 860px) {
  .wrap { padding: 0 18px; }
  .metrics { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .diagrams { grid-template-columns: minmax(0, 1fr); }
  .skip .filelist { columns: 1; }
  .step > .head { padding: 16px 16px 0; gap: 11px; }
  .step .hunks { padding: 14px 16px 16px; }
  .step .tail { padding: 12px 16px 16px 53px; }
  .headline { max-width: none; }
  .beat { grid-template-columns: minmax(0, 1fr); gap: 3px; }
  .beat .bl { text-align: left; line-height: 1.5; }
  .beat .bt { border-left: 0; padding-left: 0; }
}
@media (max-width: 720px) {
  /* A four-column file table cannot survive a phone; stack each row instead. */
  table.files, table.files tbody, table.files tr, table.files td { display: block; }
  table.files tr { border-top: 1px solid var(--line-soft); padding: 9px 0; }
  table.files td { border: 0; padding: 1px 14px; }
  table.files td.meta { display: inline-block; padding-right: 14px; }
  table.files .num { text-align: left; }
  .group > summary { gap: 8px; }
  .group .gsum { flex-basis: 100%; }
  .skip .inner { padding-left: 16px; }
  .skip .reason { margin-left: 0; }
}

/* ---------------------------------------------------------------- print */
@media print {
  :root { --shadow: none; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .nav, .tip, .passbtns, .copyout, .fold { display: none !important; }
  /* Paper shows the pass as it actually stands, ticks and all. The folds go:
     a printed report that hides the code under half its steps is worse than one
     that ignores the ticks, and on paper nothing can be unfolded. */
  .passbar { position: static; }
  .step.folded > .body { display: block; }
  /* On paper a hunk chip is not a control, but `client.py:14` is still the
     reference a reader needs, so it stays as text. */
  .href { border-color: var(--line); color: var(--ink-soft); background: none; }
  .masthead { background: #fff; }
  section { padding: 22px 0 0; break-inside: auto; }
  .card, .hunk, .delta, .seam, .dcard, .group, .skip { break-inside: avoid; box-shadow: none; }
  /* A step is routinely taller than a page. Keeping the whole card together
     buys one orphaned header and a page of white space, so only the header is
     held, and held to what follows it. */
  .step { box-shadow: none; }
  .step .hunks { break-inside: auto; }
  .step > .head { break-inside: avoid; break-after: avoid; }
  .step .tail { break-inside: avoid; }
  a { color: inherit; text-decoration: none; }
}
</style>
